<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페이지를 찾을 수 없어요 — HR T | 니핑 프로젝트</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fff6fa">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" href="/assets/icons/icon-v3-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .nf { display: grid; justify-items: center; gap: 10px; padding: 56px 0 40px; text-align: center; }
  .nf__img { width: 112px; height: 112px; margin-bottom: 8px; border-radius: 26%; box-shadow: 0 10px 22px rgb(87 74 140 / .22); }
  .nf__code { font-size: 3.5rem; font-weight: 800; line-height: 1; letter-spacing: -.04em; color: var(--pink-deep); }
  .nf__t { font-size: 1.375rem; font-weight: 800; letter-spacing: -.02em; }
  .nf__p { max-width: 20em; color: var(--ink-soft); line-height: 1.65; }
  .nf .btn { margin-top: 12px; text-decoration: none; }
</style>
</head>
<body>
<div class="app">
<script src="/assets/shell.js"></script>
<main id="main">
  <section class="wrap nf" aria-labelledby="nf-t">
    <img class="nf__img" src="/assets/icons/icon-v3-512.png" alt="" width="112" height="112">
    <p class="nf__code" aria-hidden="true">404</p>
    <h1 class="nf__t" id="nf-t">페이지를 찾을 수 없어요</h1>
    <p class="nf__p">주소가 바뀌었거나 없어진 페이지예요. 아래 버튼으로 홈에서 다시 찾아보세요.</p>
    <a class="btn" href="/">홈으로 가기</a>
  </section>
</main>
</div>
</body>
</html>
