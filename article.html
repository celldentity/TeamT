<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아티클 — HR T | 니핑 프로젝트</title>
<meta name="description" content="아티클 읽기와 댓글.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HR T | 니핑">
<meta property="og:title" content="HR T | 니핑 프로젝트">
<meta property="og:description" content="초대장 들고 놀러 오세요">
<meta property="og:image" content="https://tnieping.com/assets/og-v3.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="HR 고민, 티 내도 괜찮아요 — 라벤더 마스코트">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fff6fa">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-v3.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR T 니핑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/assets/icons/icon-v3-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<script src="/assets/shell.js"></script>
<script src="/assets/media.js"></script>
<script src="/assets/outbox.js"></script>
<main id="main">
  <section class="sec" aria-labelledby="post-title">
    <div class="wrap">
      <a class="back" href="/articles">← 아티클 목록</a>
      <article id="post"></article>
      <div class="empty" id="gone" hidden></div>
      <section id="cmSec" aria-labelledby="cm-title" hidden>
        <h2 class="sec__h3" id="cm-title">댓글 <span id="cmN" style="color:var(--ink-soft);font-weight:500"></span></h2>
        <form class="cmt-form" id="cmForm">
          <div class="writer" id="cmWho"></div>
          <textarea class="ta" name="body" rows="3" maxlength="1000" placeholder="댓글을 남겨 보세요 (1000자까지)" aria-label="댓글 쓰기"></textarea>
          <div class="cm-att" data-att></div>
          <p class="msg msg--err" id="cmErr" role="alert"></p>
          <button class="btn btn--sm" type="submit">댓글 등록</button>
        </form>
        <ul class="cmt-list" id="cmts"></ul>
      </section>
    </div>
  </section>
</main>
</div>
<script>
  TT.ready.then(async (me) => {
    if (!me) return;
    const $ = (s) => document.querySelector(s), qs = new URLSearchParams(location.search);
    let id = Number(qs.get("id")) || 0, pOid = qs.get("p") || "";   // pOid: 방금 쓴 글(아직 저장 중) — 편지함(outbox)의 번호
    let data = null, base = null, replying = 0, editing = 0;
    $("#cmWho").innerHTML = TT.chip(me);
    const fail = (m) => { $("#post").innerHTML = ""; $("#cmSec").hidden = true; $("#gone").hidden = false; $("#gone").textContent = m; };

    // ── «먼저 보여 주고 뒤에서 저장»(assets/outbox.js): 아직 서버에 가지 못한 글·댓글 변경을 화면에 겹쳐 보여 준다 ──
    const OB = TT.outbox;
    const pendingPost = (it) => { const v = it.view; return { id: 0, category: v.category, title: v.title, ai: !!v.ai, author: me, createdAt: new Date(it.at).toISOString(), updatedAt: null, likes: 0, liked: false, comments: 0, mine: true, special: null, target: null, forMe: false, qdate: null, progress: null, ref: null, cover: null, body: v.body, media: v.media || [], pending: true }; };
    function rebuild() {   // 서버에서 받은 base 위에, 아직 서버에 안 간 변경(post-edit·comment·comment-edit·comment-del)을 겹친다
      const tmps = [];
      for (const it of OB.list()) {
        if (it.kind === "post-edit" && it.postId === id) Object.assign(base.post, { category: it.view.category, title: it.view.title, body: it.view.body, ai: it.view.ai, media: it.view.media, updatedAt: base.post.updatedAt || new Date(it.at).toISOString() });
        else if (it.kind === "comment-edit") { const c = base.comments.find((x) => x.id === it.commentId); if (c) Object.assign(c, { body: it.view.body, media: it.view.media, updatedAt: c.updatedAt || new Date(it.at).toISOString() }); }
        else if (it.kind === "comment-del") { const c = base.comments.find((x) => x.id === it.commentId); if (c) c.deleted = true; }
        else if (it.kind === "comment" && it.postId === id) {
          const par = it.view.parentId ? base.comments.find((x) => x.id === it.view.parentId) : null;
          tmps.push({ id: "t" + it.oid, tmp: true, parentId: par ? (par.parentId || par.id) : null, deleted: false, author: me, body: it.view.body, media: it.view.media || [], createdAt: new Date(it.at).toISOString(), updatedAt: null, likes: 0, liked: false, mine: true, byTarget: false });
        }
      }
      data = { ...base, comments: base.comments.concat(tmps) };
    }
    const failBox = (it) => {   // 저장하지 못했을 때만 보이는 안내(그 전에는 아무것도 안 보인다)
      let el = $("#obFail"); if (!el) { el = document.createElement("div"); el.id = "obFail"; el.className = "ob-fail"; el.setAttribute("role", "alert"); $("#post").before(el); }
      el.innerHTML = `<p><b>저장하지 못했어요.</b> ${TT.esc(it.err || "")}</p><div><button class="btn btn--sm" type="button" data-ob="retry" data-oid="${it.oid}">다시 시도</button><button class="btn btn--ghost btn--sm" type="button" data-ob="drop" data-oid="${it.oid}">버리기</button></div>`;
    };
    async function load() {
      if (pOid) {   // 방금 쓴 글: 저장이 이미 끝났으면 진짜 글로, 아직이면 쓴 내용 그대로 «저장된 모습»을 보여 준다
        const d = OB.doneId(pOid);
        if (d && !OB.get(pOid)) { id = d; pOid = ""; history.replaceState(null, "", "/article?id=" + id); }
        else {
          const it = OB.get(pOid); if (!it) return fail("글을 찾을 수 없어요.");
          base = data = { categories: [], post: pendingPost(it), comments: [] };
          drawPost(); $("#cmSec").hidden = true; if (it.state === "fail") failBox(it); return;
        }
      }
      try { base = await TT.call("/api/posts?id=" + id); } catch (x) { fail(x.message); return; }
      rebuild();
      if (!$("#post").firstElementChild) drawPost();   // 댓글만 바뀐 뒤에는 글(재생 중인 동영상 포함)을 다시 그리지 않는다
      drawBanner(); drawComments(); jump();
    }
    // 저장이 끝나면 화면을 조용히 진짜 데이터로 바꾼다(쓰던 답글·수정 칸이 열려 있으면 건드리지 않는다)
    async function quietRefresh() {
      if (pOid || !base || replying || editing || document.activeElement?.matches?.("textarea")) return;
      try { base = await TT.call("/api/posts?id=" + id); rebuild(); drawBanner(); drawComments(); } catch { /* 다음에 */ }
    }
    OB.on((ev) => {
      if (ev.type === "done") {
        if (pOid && ev.item.oid === pOid) { id = ev.result.id; pOid = ""; history.replaceState(null, "", "/article?id=" + id); $("#obFail")?.remove(); $("#post").innerHTML = ""; load(); }
        else if (!pOid) quietRefresh();
      } else if (ev.type === "fail") { if (!pOid || ev.item.oid === pOid) failBox(ev.item); }
    });
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-ob]"); if (!b) return;
      if (b.dataset.ob === "retry") { OB.retry(b.dataset.oid); $("#obFail")?.remove(); }
      else { const k = OB.get(b.dataset.oid); OB.drop(b.dataset.oid); $("#obFail")?.remove(); if (k && k.kind === "post") location.href = "/articles"; else if (!pOid) load(); }
    });
    // 알림에서 들어오면(#c댓글번호) 그 댓글로 스크롤하고 잠깐 강조한다 — 처음 한 번만
    let jumped = false;
    function jump() {
      if (jumped) return; jumped = true;
      const m = /^#c(\d+)$/.exec(location.hash), el = m && document.querySelector(`[data-cid="${m[1]}"]`);
      if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("cmt--hit"); }
    }
    const likeBtn = (cls, kind, tid, liked, n) => `<button class="${cls}" type="button" data-act="like" data-kind="${kind}" data-id="${tid}" aria-pressed="${liked}">${TT.heart}<span>${n}</span></button>`;

    // 사진·동영상: 가로로 넘겨 보는 띠(여러 개일 때 «1 / 3» 표시). 사진을 누르면 화면 가득 크게, 동영상은 그 자리에서 재생.
    const media = (m, v) => `/api/media?id=${m.id}&v=${v}`;
    const gallery = (ms) => !ms.length ? "" : `<div class="gal" id="gal" role="group" aria-label="사진·동영상 ${ms.length}개" tabindex="0">${ms.map((m, i) => m.kind === "video"
        ? `<div class="gal__it gal__it--v"><video controls playsinline preload="metadata"${m.thumb ? ` poster="${media(m, "thumb")}"` : ""} src="${media(m, "full")}"></video></div>`
        : `<button class="gal__it gal__it--i" type="button" data-big="${m.id}" aria-label="사진 ${i + 1} 크게 보기"><img src="${media(m, "full")}" alt="" ${i ? 'loading="lazy"' : ""} decoding="async"></button>`).join("")}</div>
      ${ms.length > 1 ? `<p class="gal__n" id="galN" aria-live="polite">1 / ${ms.length}</p>` : ""}`;
    function bindGallery() {
      const g = $("#gal"); if (!g) return;
      const n = $("#galN");
      if (n) g.addEventListener("scroll", () => { n.textContent = `${Math.round(g.scrollLeft / g.clientWidth) + 1} / ${g.children.length}`; }, { passive: true });
      g.addEventListener("click", (e) => { const b = e.target.closest("[data-big]"); if (b) openBig(b); });
    }
    function openBig(b) {
        const lb = document.createElement("div"); lb.className = "lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true"); lb.setAttribute("aria-label", "사진 크게 보기");
        lb.innerHTML = `<img src="${media({ id: b.dataset.big }, "full")}" alt=""><button class="lb__x" type="button" aria-label="닫기">×</button>`;
        const close = () => { lb.remove(); document.removeEventListener("keydown", esc); document.body.style.overflow = ""; b.focus(); };
        const esc = (k) => { if (k.key === "Escape") close(); };
        lb.addEventListener("click", close); document.addEventListener("keydown", esc);
        document.body.style.overflow = "hidden"; document.body.appendChild(lb); lb.querySelector(".lb__x").focus();
    }
    document.addEventListener("click", (e) => { const b = e.target.closest(".cmt__media [data-big]"); if (b) openBig(b); });   // 댓글에 붙은 사진도 크게 보기
    function drawPost() {
      const p = data.post, a = TT.who(p.author);
      document.title = p.title + " — HR T | 니핑 프로젝트";
      $("#post").className = "post post--" + TT.kind(p);
      $("#post").innerHTML = `
        <div class="art__meta"><span class="chip">${TT.esc(p.category)}</span>${TT.specialChip(p)}${TT.kindChip(p)}</div>
        <h1 class="post__title" id="post-title">${TT.esc(p.title)}</h1>
        <div class="by"><span class="by__av">${TT.avatar(a)}</span><div><p class="by__name">${TT.esc(a.nickname)}</p><p class="by__time">${TT.when(p.createdAt)}${p.updatedAt ? " · 수정됨" : ""}</p></div></div>
        <div id="spBanner"></div>
        ${gallery(p.media || [])}
        <div class="post__body">${TT.esc(p.body)}</div>
        ${p.pending ? "" : `<div class="post__bar">${likeBtn("like", "p", p.id, p.liked, p.likes)}<span class="bar__sp"></span>
          ${p.mine ? `<a class="btn btn--ghost btn--sm" href="/write?id=${p.id}">수정</a><button class="btn btn--ghost btn--sm" type="button" data-act="del-post">삭제</button>` : ""}</div>`}`;
      $("#cmSec").hidden = !!p.pending; bindGallery();
    }

    // 오늘의 질문(지목된 사람)·이번 주 토론(진척도·AI 정리 단계)·정리된 아티클 안내
    function drawBanner() {
      const p = data.post, box = $("#spBanner"); if (!box) return;
      let h = "";
      if (p.special === "daily" && p.target) {
        const t = TT.who(p.target);
        h = `<div class="sp-card sp-card--daily"><span class="sp-card__av">${TT.avatar(t)}</span><div class="sp-card__t"><b>오늘 지목된 사람 · ${TT.esc(t.nickname)}</b><p>${p.answered ? "답변이 올라왔어요. 다른 분들도 이어서 이야기해 보세요." : p.forMe ? "오늘의 질문이 나에게 왔어요! 아래에 답변을 남겨 주세요." : "지목된 분의 답변을 기다리고 있어요."}</p></div>${p.forMe && !p.answered ? '<button class="btn btn--sm" type="button" data-act="answer">답변하러 가기</button>' : ""}</div>`;
      } else if (p.special === "weekly" && p.progress) {
        const g = p.progress, msg = g.stage === "done" ? "토론이 끝났어요. T조 AI가 아티클로 정리했어요." : g.stage === "review" ? "T조 AI가 정리하고 질문을 남겼어요. 이어서 의견을 나눠 주세요." : g.pct >= 100 ? "T조 AI가 곧 정리하러 와요(몇 분 걸려요)." : `댓글이 ${g.goal}개 모이면 T조 AI가 정리하고 질문을 던져요.`;
        h = `<div class="sp-card sp-card--weekly"><div class="sp-card__row"><b>의논 진행도</b><span>${Math.min(g.done, g.goal)}/${g.goal} · ${g.pct}%</span></div><span class="sp__bar sp__bar--lg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${g.pct}"><i style="width:${g.pct}%"></i></span><p>${msg}</p>${p.ref ? `<a class="btn btn--sm" href="/article?id=${p.ref}">정리된 아티클 보기</a>` : ""}</div>`;
      } else if (p.special === "digest") {
        h = `<div class="sp-card sp-card--digest"><div class="sp-card__t"><b>이번 주 토론을 T조 AI가 정리한 글이에요</b><p>인살롱에 올려도 좋은지 읽어 보고 고칠 곳은 댓글로 알려 주세요.</p></div>${p.ref ? `<a class="btn btn--ghost btn--sm" href="/article?id=${p.ref}">토론 보러 가기</a>` : ""}</div>`;
      }
      box.innerHTML = h;
      const ta = $("#cmForm textarea");
      if (ta) ta.placeholder = p.special === "weekly" ? `의견을 남겨 주세요 (댓글 ${p.progress ? p.progress.goal : 10}개가 모이면 T조 AI가 정리해요)` : p.special === "daily" && p.forMe && !p.answered ? "지목받은 질문에 답해 보세요" : "댓글을 남겨 보세요 (1000자까지)";
    }

    // ── 댓글 사진·동영상 첨부: 사진 4개까지·동영상 1개(100MB 이하). 파일은 서버를 거치지 않고 R2 로 바로 올라간다(assets/media.js).
    const CM = TT.media;
    const ATT_HTML = '<div class="cm-att__grid"></div><label class="cm-att__add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h2l1.3-1.8h6.4L16.5 6h2A1.5 1.5 0 0 1 20 7.5v10a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5zM12 16.2a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8z"/></svg>사진·영상<input type="file" accept="image/*,video/mp4,video/quicktime,video/webm" multiple hidden></label><span class="cm-att__hint">사진 4개 · 영상 1개(100MB까지)</span>';
    const atts = new WeakMap();   // 폼 → 첨부 도구
    function attach(form, initial) {
      const box = form.querySelector("[data-att]"); if (!box) return null;
      box.innerHTML = ATT_HTML;
      const grid = box.querySelector(".cm-att__grid"), input = box.querySelector("input"), err = (m) => showErr(form, m);
      const items = (initial || []).map((m) => ({ id: m.id, kind: m.kind, preview: m.thumb ? media(m, "thumb") : null, done: true, old: true }));
      const draw = () => {
        grid.innerHTML = items.map((it, i) => `<div class="cm-att__it">${it.preview ? `<img src="${it.preview}" alt="">` : ""}${it.kind === "video" ? '<span class="cm-att__v" aria-hidden="true">▶</span>' : ""}${it.done ? "" : `<span class="cm-att__p">${Math.round((it.p || 0) * 100)}%</span>`}<button class="cm-att__x" type="button" data-i="${i}" aria-label="빼기">×</button></div>`).join("");
        box.classList.toggle("is-full", items.length >= CM.C_MAX_FILES);
      };
      const A = {
        ids: () => items.filter((it) => it.done).map((it) => it.id),
        media: () => items.filter((it) => it.done).map((it) => ({ id: it.id, kind: it.kind, thumb: !!(it.preview || it.thumb) })),
        uploading: () => items.some((it) => !it.done),
        reset() { items.length = 0; draw(); },                                                  // 보낸 뒤: 파일은 이제 댓글 것이라 지우지 않는다
        dispose() { items.forEach((it) => { if (it.xhr) it.xhr.abort(); else if (it.done && !it.old) CM.discard(it.id); }); items.length = 0; },   // 쓰다 말았을 때: 새로 올린 파일은 치운다
      };
      grid.addEventListener("click", (e) => {
        const x = e.target.closest(".cm-att__x"); if (!x) return;
        const it = items.splice(Number(x.dataset.i), 1)[0];
        if (it.xhr) it.xhr.abort(); else if (it.done && !it.old) CM.discard(it.id);
        draw();
      });
      input.addEventListener("change", async () => {
        const files = [...input.files]; input.value = ""; err("");
        for (const file of files) {
          const c = CM.classify(file);
          if (!c) { err("사진(JPG·PNG·WEBP)과 동영상(MP4·MOV·WEBM)만 올릴 수 있어요."); continue; }
          if (items.length >= CM.C_MAX_FILES) { err(`댓글에는 사진·동영상을 ${CM.C_MAX_FILES}개까지 붙일 수 있어요.`); break; }
          if (c.kind === "video" && items.some((it) => it.kind === "video")) { err("댓글에는 동영상을 1개까지 붙일 수 있어요."); continue; }
          let it;
          try {
            const p = await CM.prepare(file, { maxVideo: CM.C_MAX_VIDEO });
            it = p; it.done = false; it.p = 0; it.id = 0; items.push(it); draw();   // 준비된 파일 객체를 그대로 항목으로 쓴다(올리는 동안 it.xhr 에 요청이 걸린다)
            const m = await CM.upload(it, (v) => { it.p = v; const el = grid.children[items.indexOf(it)]; if (el) { const t = el.querySelector(".cm-att__p"); if (t) t.textContent = Math.round(v * 100) + "%"; } }, "comment");
            it.id = m.id; it.done = true; it.xhr = null; draw();
          } catch (x) {
            const k = it ? items.indexOf(it) : -1; if (k >= 0) items.splice(k, 1); draw();
            if (!x.aborted) err(x.friendly || /^동영상|^댓글|^사진|^올/.test(x.message) ? x.message : "올리지 못했어요. 다시 시도해 주세요.");
          }
        }
      });
      draw(); atts.set(form, A); return A;
    }
    // 댓글에 붙은 사진·동영상 보여 주기(하나면 크게, 여러 개면 2열 타일). 사진은 누르면 크게, 동영상은 그 자리에서 재생.
    const cmedia = (ms) => !ms || !ms.length ? "" : `<div class="cmt__media cmt__media--${Math.min(ms.length, 2)}">${ms.map((m, i) => m.kind === "video"
      ? `<div class="cm-m cm-m--v"><video controls playsinline preload="metadata"${m.thumb ? ` poster="${media(m, "thumb")}"` : ""} src="${media(m, "full")}"></video></div>`
      : `<button class="cm-m cm-m--i" type="button" data-big="${m.id}" aria-label="사진 크게 보기"><img src="${media(m, ms.length === 1 ? "full" : "thumb")}" alt="" loading="lazy" decoding="async"></button>`).join("")}</div>`;
    function bindAtts() {
      document.querySelectorAll("form[data-act]").forEach((f) => {
        const c = f.dataset.act === "save-edit" ? data.comments.find((x) => x.id === Number(f.dataset.id)) : null;
        attach(f, c && c.media);
      });
    }
    const disposeAtts = () => document.querySelectorAll("form[data-act]").forEach((f) => { const a = atts.get(f); if (a) a.dispose(); });

    function cmt(c, reply) {
      if (c.deleted) return `<div class="cmt"><span class="cmt__av cmt__av--gone"></span><div><p class="cmt__txt cmt__txt--gone">삭제된 댓글이에요.</p></div></div>`;
      const a = TT.who(c.author), isEdit = editing === c.id;
      return `<div class="cmt" data-cid="${c.id}"><span class="cmt__av">${TT.avatar(a)}</span><div>
        <div class="cmt__top"><span class="cmt__name">${TT.esc(a.nickname)}</span>${c.author === null ? '<span class="chip chip--ai chip--xs">AI</span>' : ""}${c.byTarget ? '<span class="chip chip--daily chip--xs">지목 답변</span>' : ""}<span class="cmt__time">${TT.when(c.createdAt)}${c.updatedAt ? " · 수정됨" : ""}</span></div>
        ${isEdit ? `<form class="cmt-edit" data-act="save-edit" data-id="${c.id}"><div class="writer">${TT.chip(me)}</div><textarea class="ta" maxlength="1000" aria-label="댓글 수정">${TT.esc(c.body)}</textarea><div class="cm-att" data-att></div><p class="msg msg--err" role="alert"></p>
            <div class="cmt-edit__btns"><button class="btn btn--ghost btn--sm" type="button" data-act="cancel">취소</button><button class="btn btn--sm" type="submit">저장</button></div></form>`
          : `${c.body ? `<p class="cmt__txt">${TT.esc(c.body)}</p>` : ""}${cmedia(c.media)}
        ${c.tmp ? "" : `<div class="cmt__act">${likeBtn("lnk", "c", c.id, c.liked, c.likes)}<button class="lnk" type="button" data-act="reply" data-id="${c.id}">답글</button>
          ${c.mine ? `<button class="lnk" type="button" data-act="edit" data-id="${c.id}">수정</button><button class="lnk" type="button" data-act="del" data-id="${c.id}">삭제</button>` : ""}</div>`}`}
        ${replying === c.id ? `<form class="cmt-form" data-act="send-reply" data-id="${c.id}"><div class="writer">${TT.chip(me)}</div><textarea class="ta" maxlength="1000" placeholder="답글을 남겨 보세요" aria-label="답글 쓰기">${reply ? TT.esc("@" + a.nickname + " ") : ""}</textarea><div class="cm-att" data-att></div><p class="msg msg--err" role="alert"></p>
            <div class="cmt-edit__btns"><button class="btn btn--ghost btn--sm" type="button" data-act="cancel">취소</button><button class="btn btn--sm" type="submit">답글 등록</button></div></form>` : ""}
      </div></div>`;
    }
    function drawComments() {
      const all = data.comments, tops = all.filter((c) => !c.parentId);
      $("#cmN").textContent = all.filter((c) => !c.deleted).length + "개";
      $("#cmts").innerHTML = tops.length ? tops.map((c) => {
        const kids = all.filter((k) => k.parentId === c.id);
        return `<li class="cmt-item">${cmt(c, false)}${kids.length ? `<div class="cmt__replies">${kids.map((k) => cmt(k, true)).join("")}</div>` : ""}</li>`;
      }).join("") : `<li class="empty" style="margin-top:12px">첫 댓글을 남겨 보세요.</li>`;
      bindAtts();
    }

    const send = (url, method, body) => TT.call(url, method, body);
    const showErr = (form, m) => { const e = form.querySelector(".msg"); if (e) e.textContent = m; };
    const textOf = (form) => form.querySelector("textarea").value;

    // 댓글 쓰기
    $("#cmForm").addEventListener("submit", async (e) => {
      e.preventDefault(); const f = e.currentTarget; $("#cmErr").textContent = "";
      const A = atts.get(f), ids = A ? A.ids() : [];
      if (A && A.uploading()) { $("#cmErr").textContent = "사진·동영상을 올리는 중이에요. 잠시만 기다려 주세요."; return; }
      if (!f.body.value.trim() && !ids.length) { $("#cmErr").textContent = "댓글 내용을 적어 주세요(사진·동영상만 올려도 돼요)."; return; }
      // 편지함에 넣고 화면에는 바로 올린다(저장은 뒤에서)
      OB.add({ kind: "comment", url: "/api/comments", method: "POST", body: { postId: id, body: f.body.value, media: ids }, postId: id, view: { parentId: 0, body: f.body.value.trim(), media: A ? A.media() : [] } });
      f.body.value = ""; if (A) A.reset(); rebuild(); drawComments();
    });

    attach($("#cmForm"));
    // 좋아요: 낙관적 갱신. 같은 하트를 연타해도 요청은 순서대로 하나씩 간다(서버는 누를 때마다 켜고 끄는 방식이라 누른 횟수의 홀짝이 맞아야 한다).
    const likeQ = new Map(), likeWait = new Map();   // 대상(글/댓글+번호) → 이어 붙인 요청 줄 / 아직 안 끝난 요청 수
    function paintLike(b, liked, n) { b.setAttribute("aria-pressed", String(liked)); b.querySelector("span").textContent = n; }
    function like(b, cid) {
      const kind = b.dataset.kind, key = kind + cid, target = kind === "p" ? [data.post] : data.comments.filter((c) => c.id === cid);
      const was = b.getAttribute("aria-pressed") === "true", n = Number(b.querySelector("span").textContent) || 0;
      const liked = !was, count = Math.max(0, n + (liked ? 1 : -1));
      paintLike(b, liked, count); target.forEach((x) => { x.liked = liked; x.likes = count; });
      likeWait.set(key, (likeWait.get(key) || 0) + 1);
      likeQ.set(key, (likeQ.get(key) || Promise.resolve()).then(async () => {
        try {
          const r = await send("/api/likes", "POST", { type: kind, id: cid });
          if (likeWait.get(key) === 1) { const el = document.querySelector(`button[data-act="like"][data-kind="${kind}"][data-id="${cid}"]`); if (el) paintLike(el, r.liked, r.count); target.forEach((x) => { x.liked = r.liked; x.likes = r.count; }); }   // 마지막 요청이 끝났을 때만 서버 숫자(다른 사람이 누른 것 포함)로 맞춘다
        } catch (x) {
          const el = document.querySelector(`button[data-act="like"][data-kind="${kind}"][data-id="${cid}"]`);   // 저장 실패: 이 한 번의 변경만 되돌린다
          if (el) { const c = Number(el.querySelector("span").textContent) || 0, was2 = el.getAttribute("aria-pressed") === "true"; paintLike(el, !was2, Math.max(0, c + (was2 ? -1 : 1))); }
          target.forEach((y) => { y.liked = !y.liked; y.likes = Math.max(0, y.likes + (y.liked ? 1 : -1)); });
          TT.toast("좋아요를 저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.");
        } finally { likeWait.set(key, likeWait.get(key) - 1); }
      }));
    }

    // 나머지 동작은 한곳에서 받는다(목록이 다시 그려져도 동작하도록)
    document.addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-act]"); if (!b || !data) return;
      const act = b.dataset.act, cid = Number(b.dataset.id);
      try {
        if (act === "like") {   // 하트는 누르는 순간 화면에 먼저 반영하고(숫자만 바꾼다 — 쓰던 답글·수정 내용이 사라지지 않게), 저장은 뒤에서 조용히 한다
          like(b, cid);
        } else if (act === "answer") { const ta = $("#cmForm textarea"); ta.scrollIntoView({ block: "center", behavior: "smooth" }); setTimeout(() => ta.focus(), 400);
        } else if (act === "reply") { disposeAtts(); replying = replying === cid ? 0 : cid; editing = 0; drawComments(); setTimeout(() => { const ta = document.querySelector(`form[data-act="send-reply"] textarea`); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }, 0); }
        else if (act === "edit") { disposeAtts(); editing = cid; replying = 0; drawComments(); }
        else if (act === "cancel") { disposeAtts(); replying = 0; editing = 0; drawComments(); }
        else if (act === "del") { if (confirm("이 댓글을 지울까요? 되돌릴 수 없어요.")) { OB.add({ kind: "comment-del", url: "/api/comments?id=" + cid, method: "DELETE", commentId: cid, postId: id }); rebuild(); drawComments(); } }
        else if (act === "del-post") { if (confirm("이 글을 지울까요? 댓글과 좋아요도 함께 지워지고 되돌릴 수 없어요.")) { OB.add({ kind: "post-del", url: "/api/posts?id=" + id, method: "DELETE", postId: id }, { defer: true }); location.href = "/articles"; } }
      } catch (x) { alert(x.message); }
    });
    document.addEventListener("submit", async (e) => {
      const f = e.target.closest("form[data-act]"); if (!f) return; e.preventDefault();
      const act = f.dataset.act, cid = Number(f.dataset.id); showErr(f, "");
      const A = atts.get(f), ids = A ? A.ids() : [];
      if (A && A.uploading()) { showErr(f, "사진·동영상을 올리는 중이에요. 잠시만 기다려 주세요."); return; }
      if (!textOf(f).trim() && !ids.length) { showErr(f, "내용을 적어 주세요(사진·동영상만 올려도 돼요)."); return; }
      const view = { body: textOf(f).trim(), media: A ? A.media() : [] };
      if (act === "save-edit") OB.add({ kind: "comment-edit", url: "/api/comments?id=" + cid, method: "PATCH", body: { body: textOf(f), media: ids }, commentId: cid, postId: id, view });
      else OB.add({ kind: "comment", url: "/api/comments", method: "POST", body: { postId: id, parentId: cid, body: textOf(f), media: ids }, postId: id, view: { ...view, parentId: cid } });
      if (A) A.reset(); replying = 0; editing = 0; rebuild(); drawComments();
    });

    if (!id && !pOid) return fail("글을 찾을 수 없어요.");
    load();
  });
</script>
</body>
</html>
