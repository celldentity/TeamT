<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아티클 — HR T | 니핑 프로젝트</title>
<meta name="description" content="AI와 함께 쓰고 다듬은 HR 이야기 모음.">
<meta name="theme-color" content="#fff6fa">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-v2.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR T 니핑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/assets/icons/icon-v2-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<script src="/assets/shell.js"></script>
<main id="main">
  <section class="sec" aria-labelledby="art-title">
    <div class="wrap">
      <div class="sec__head">
        <h1 class="sec__title" id="art-title">아티클</h1>
      </div>
      <p class="sec__lead">AI와 함께 쓰고 다듬은 HR 이야기를 모았어요. 팀원 누구나 글을 쓰고 댓글로 이야기할 수 있어요.</p>
      <p class="legend" id="legend"></p>
      <ul class="arts" id="arts"></ul>
      <div class="empty" id="empty" hidden>아직 글이 없어요. 첫 글을 써 보세요.</div>
      <p class="msg msg--err" id="err" role="alert"></p>
    </div>
  </section>
</main>
</div>
<script>
  TT.ready.then(async (user) => {
    if (!user) return;
    document.getElementById("legend").innerHTML = `<span class="legend__t">글 종류</span>${["human", "assist", "ai"].map(TT.kindChipOf).join("")}`;
    try {
      const { posts } = await TT.call("/api/posts");
      document.getElementById("arts").innerHTML = posts.map(TT.postCard).join("");
      document.getElementById("empty").hidden = posts.length > 0;
    } catch (e) { document.getElementById("err").textContent = e.message; }
  });
</script>
</body>
</html>
