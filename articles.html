<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아티클 — HR T | 니핑 프로젝트</title>
<meta name="description" content="AI와 함께 쓰고 다듬은 HR 이야기 모음.">
<meta name="theme-color" content="#fff6fa">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-v3.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR T 니핑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/assets/icons/icon-v3-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<script src="/assets/shell.js"></script>
<main id="main">
  <section class="sec" aria-labelledby="art-title">
    <div class="wrap">
      <div class="sec__head">
        <h1 class="sec__title" id="art-title">아티클 <small id="count"></small></h1>
      </div>
      <p class="sec__lead">팀원과 T조 AI가 함께 쓰는 HR 이야기예요.</p>
      <div class="bar" id="bar" role="toolbar" aria-label="분류로 거르기"></div>
      <ul class="arts" id="arts"></ul>
      <div class="empty" id="empty" hidden></div>
      <p class="msg msg--err" id="err" role="alert"></p>
    </div>
  </section>
</main>
</div>
<script>
  TT.ready.then(async (user) => {
    if (!user) return;
    const $ = (id) => document.getElementById(id);
    let posts = [], cats = [], cur = "전체";
    // 분류 칩으로 거르기 — 글이 많아져도 원하는 분류만 골라 볼 수 있다. 칩마다 글 수를 함께 보여 준다.
    function draw() {
      const list = cur === "전체" ? posts : posts.filter((p) => p.category === cur);
      $("bar").innerHTML = ["전체", ...cats].map((c) => {
        const n = c === "전체" ? posts.length : posts.filter((p) => p.category === c).length;
        return `<button type="button" data-c="${TT.esc(c)}" aria-pressed="${c === cur}">${TT.esc(c)} ${n}</button>`;
      }).join("");
      $("arts").innerHTML = list.map(TT.postCard).join("");
      $("count").textContent = list.length;
      $("empty").hidden = list.length > 0;
      $("empty").textContent = posts.length ? "이 분류에는 아직 글이 없어요." : "아직 글이 없어요. 첫 글을 써 보세요.";
    }
    $("bar").addEventListener("click", (e) => { const b = e.target.closest("[data-c]"); if (b) { cur = b.dataset.c; draw(); window.scrollTo({ top: 0 }); } });
    try { const r = await TT.call("/api/posts"); posts = r.posts; cats = r.categories; draw(); }
    catch (e) { $("err").textContent = e.message; }
  });
</script>
</body>
</html>
