<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR T | 니핑 프로젝트 — 오늘도 HR에 인사이트 한 스푼</title>
<meta name="description" content="Midfielder 8기 T조가 AI와 함께 만들어 가는 HR 이야기. 인사이트 아티클을 만나 보세요.">
<meta name="theme-color" content="#fff6fa">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-v3.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR T 니핑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/assets/icons/icon-v3-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<script src="/assets/shell.js"></script>
<script src="/assets/outbox.js"></script>
<main id="main">
  <section class="cal" aria-label="오늘의 HR 일력">
    <div class="wrap">
      <div class="cal__stack" id="calStack">
        <article class="cal__sheet" id="calSheet" aria-live="polite"></article>
      </div>
      <div class="cal__nav">
        <button class="cal__btn" type="button" id="calPrev" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg>지난 장</button>
        <span class="cal__pos" id="calPos"></span>
        <button class="cal__btn" type="button" id="calNext" disabled>다음 장<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
      </div>
      <div class="hero__act"><a class="btn" href="/articles">아티클 만나보기</a></div>
    </div>
  </section>

  <section class="sec" aria-labelledby="new-title">
    <div class="wrap">
      <h2 class="sec__title" id="new-title">새로 올라온 글</h2>
      <ul class="arts" id="newArts"></ul>
      <p class="note"><a href="/articles"><b>아티클 전체 보기</b></a></p>
      <p class="note" style="margin-top:32px">HR T | 니핑 프로젝트(B급 부제: HR 떡밥 리텐션 프로젝트)는 가칭이며 이름이 바뀔 수 있습니다.<br>© 2026 Midfielder 8th · Team T</p>
    </div>
  </section>
</main>
</div>
<script>
  TT.ready.then(async (user) => {
    if (!user) return;
    // ── HR 일력: 오늘 카드와 지난 카드. 날짜는 바로 보이고(서버 응답 전에도), 내용은 받아 오는 대로 채운다. «지난 장»을 누르면 지금 장이 종이처럼 떨어져 나가며 앞 장이 보인다.
    const WD = ["일", "월", "화", "수", "목", "금", "토"], $ = (s) => document.querySelector(s), sheet = $("#calSheet");
    let cards = [], at = 0;
    const dparts = (iso) => { const [y, m, d] = iso.split("-").map(Number), w = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return { y, m, d, w: WD[w] }; };
    const sheetHtml = (c) => { const p = dparts(c.date); return `<div class="cal__bind" aria-hidden="true"><i></i><i></i></div>
      <div class="cal__head"><span class="cal__ym">${p.y}년 ${p.m}월</span><span class="cal__cat">${TT.esc(c.category || "")}</span></div>
      <div class="cal__day">${p.d}</div><p class="cal__wd">${p.w}요일</p>
      ${c.quote ? `<blockquote class="cal__q">${TT.esc(c.quote)}</blockquote><p class="cal__note">${TT.esc(c.note)}</p><p class="cal__ask"><b>생각해 볼 질문</b>${TT.esc(c.question)}</p>` : `<div class="cal__wait" aria-hidden="true"><i></i><i></i><i></i></div>`}`; };
    const kst = new Date(Date.now() + 9 * 36e5).toISOString().slice(0, 10);
    sheet.innerHTML = sheetHtml({ date: kst });   // 내용이 오기 전에도 오늘 날짜는 먼저 보인다
    function paint() {
      sheet.innerHTML = sheetHtml(cards[at]);
      $("#calPrev").disabled = at >= cards.length - 1; $("#calNext").disabled = at <= 0;
      $("#calPos").textContent = at === 0 ? "오늘" : `${at}일 전 장`;
    }
    function turn(dir) {   // dir +1 = 지난 장으로, -1 = 다음 장으로
      const to = at + dir; if (to < 0 || to >= cards.length) return;
      const go = () => { at = to; paint(); };
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return go();
      const old = sheet.cloneNode(true); old.removeAttribute("id"); old.removeAttribute("aria-live"); old.classList.add(dir > 0 ? "is-tear" : "is-tear is-tear--back"); old.setAttribute("aria-hidden", "true");
      sheet.parentNode.insertBefore(old, sheet); go();
      sheet.classList.remove("is-in"); void sheet.offsetWidth; sheet.classList.add("is-in");
      old.addEventListener("animationend", () => old.remove(), { once: true }); setTimeout(() => old.remove(), 900);
    }
    $("#calPrev").addEventListener("click", () => turn(1)); $("#calNext").addEventListener("click", () => turn(-1));
    TT.call("/api/today?days=14").then((r) => { cards = [r.today, ...r.past]; at = 0; paint(); }).catch(() => { sheet.innerHTML = sheetHtml({ date: kst, category: "", quote: "" }); });
    try { const { posts } = await TT.call("/api/posts?limit=3"); document.getElementById("newArts").innerHTML = TT.outbox.merge(posts, user).slice(0, 3).map(TT.postCard).join(""); } catch {}
  });
</script>
</body>
</html>
