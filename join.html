<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>들어가기 — HR T | 니핑 프로젝트</title>
<meta name="description" content="이메일과 비밀번호로 들어오세요. 처음이라면 초대장이 필요해요.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23F9A8CD'/%3E%3Cpath d='M8 9h16v4h-6v10h-4V13H8z' fill='%23171719'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<script src="/assets/shell.js"></script>
<main id="main">
  <div class="wrap">
    <section class="gate" aria-labelledby="gate-title">
      <div>
        <h1 id="gate-title">초대받은 분만<br>들어올 수 있어요</h1>
        <p>이메일과 비밀번호로 들어오세요. 처음이라면 초대장이 필요해요.</p>
      </div>
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M100 178C40 132 14 99 14 69 14 45 32 29 54 29c19 0 36 10 46 28 10-18 27-28 46-28 22 0 40 16 40 40 0 30-26 63-86 109Z" fill="#f9a8cd"/>
        <rect x="63" y="60" width="80" height="90" rx="13" fill="#fff" stroke="#f9a8cd" stroke-width="3" transform="rotate(-3 103 105)"/>
        <g transform="rotate(-3 103 105)"><circle cx="88" cy="88" r="3.4" fill="#2b2540"/><circle cx="118" cy="88" r="3.4" fill="#2b2540"/><path d="M94 97q9 9 18 0" fill="none" stroke="#2b2540" stroke-width="2.6" stroke-linecap="round"/><rect x="79" y="114" width="48" height="6" rx="3" fill="#b9a6f0"/></g>
        <path d="M172 6q2 16 18 18-16 2-18 18-2-16-18-18 16-2 18-18Z" fill="#b9a6f0"/>
      </svg>
    </section>

    <form class="form" id="form" novalidate>
      <label class="field">이메일
        <input name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" required>
      </label>
      <label class="field">비밀번호
        <input name="password" type="password" placeholder="8자 이상" autocomplete="current-password" minlength="8" required>
      </label>

      <button class="more" type="button" id="more" aria-expanded="false" aria-controls="first">
        처음이에요 · 초대장이 있어요
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="first" id="first" hidden>
        <label class="field">초대장 코드
          <input name="code" type="text" placeholder="링크로 들어오면 자동으로 채워져요" autocomplete="off" autocapitalize="characters" maxlength="20" spellcheck="false">
        </label>
        <p class="msg" id="codeMsg" role="status"></p>
        <label class="field">닉네임
          <input name="nickname" type="text" placeholder="2~20자, 나중에 바꿀 수 있어요" autocomplete="nickname" maxlength="20">
        </label>
        <p class="note" style="margin:0">초대장은 이미 가입한 팀원이 마이페이지에서 만들어 줘요.</p>
      </div>

      <div class="actions">
        <p class="msg msg--err" id="err" role="alert"></p>
        <button class="btn btn--block" type="submit" id="btn">들어가기</button>
      </div>
    </form>
  </div>
</main>
</div>
<script>
  TT.ready.then(() => {
    const $ = (s) => document.querySelector(s), form = $("#form"), more = $("#more"), first = $("#first");
    const norm = (v) => v.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    const len = (s) => [...s.trim()].length;

    function setFirst(open) {
      more.setAttribute("aria-expanded", String(open)); first.hidden = !open; more.classList.remove("attn");
      form.password.autocomplete = open ? "new-password" : "current-password";
      label();
    }
    // 처음 오는 사람(초대장 코드를 적었을 때)만 버튼 글자가 "가입하고 들어가기"로 바뀐다
    function label() { $("#btn").textContent = !first.hidden && norm(form.code.value).length === 12 ? "가입하고 들어가기" : "들어가기"; }
    more.addEventListener("click", () => setFirst(first.hidden));

    // 초대장 코드를 입력하면 바로 확인해서 누가 보낸 초대장인지 보여 준다
    let last = "";
    async function check() {
      const c = norm(form.code.value), msg = $("#codeMsg");
      label();
      if (c === last) return; last = c;
      msg.className = "msg"; msg.textContent = "";
      if (c.length !== 12) return;
      try {
        const r = await TT.call("/api/invites?check=" + c);
        msg.className = r.valid ? "msg msg--ok" : "msg msg--err";
        msg.textContent = r.valid ? (r.inviter ? r.inviter + "님이 초대했어요." : "T조 운영자가 보낸 초대장이에요.") : "사용할 수 없는 초대장이에요. 이미 쓰였거나 기한이 지났을 수 있어요.";
      } catch (x) { msg.className = "msg msg--err"; msg.textContent = x.message; }
    }
    form.code.addEventListener("input", check);

    const fromLink = new URLSearchParams(location.search).get("code");
    if (fromLink) { form.code.value = norm(fromLink); setFirst(true); check(); form.email.focus(); }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("#btn"), text = btn.textContent, err = $("#err"); err.textContent = "";
      const d = Object.fromEntries(new FormData(form)), email = d.email.trim(), code = norm(d.code || ""), nick = d.nickname || "";
      if (!email || !d.password) { err.textContent = "이메일과 비밀번호를 입력해 주세요."; return; }
      // 처음 가입하려는 경우(코드나 닉네임을 적었을 때)는 서버로 보내기 전에 빠진 곳을 알려 준다
      if (!first.hidden && (code || nick.trim())) {
        if (code.length !== 12) { err.textContent = "초대장 코드 12자리를 입력해 주세요."; return; }
        if (d.password.length < 8) { err.textContent = "비밀번호는 8자 이상으로 정해 주세요."; return; }
        if (len(nick) < 2 || len(nick) > 20) { err.textContent = "닉네임은 2~20자로 정해 주세요."; return; }
      }
      btn.disabled = true; btn.textContent = "잠시만요…";
      try {
        await TT.call("/api/auth?a=enter", "POST", { email, password: d.password, code, nickname: nick });
        location.href = "/";
      } catch (x) {
        err.textContent = x.message;
        if (first.hidden) more.classList.add("attn");   // 처음이라면 여기를 누르라고 눈에 띄게
        btn.disabled = false; btn.textContent = text;
      }
    });
    label();
  });
</script>
</body>
</html>
