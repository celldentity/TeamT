<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>들어가기 — HR T | 니핑 프로젝트</title>
<meta name="description" content="이메일과 비밀번호로 들어오세요. 처음이라면 초대장이 필요해요.">
<meta name="theme-color" content="#fff6fa">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR T 니핑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23F9A8CD'/%3E%3Cpath d='M8 9h16v4h-6v10h-4V13H8z' fill='%23171719'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<script src="/assets/shell.js"></script>
<main id="main">
  <div class="wrap">
    <section class="gate" aria-labelledby="gate-title">
      <div>
        <h1 id="gate-title">초대받은 분만<br>들어올 수 있어요</h1>
        <p id="gate-sub">이메일과 비밀번호로 들어오세요. 처음이라면 초대장이 필요해요.</p>
      </div>
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M100 178C40 132 14 99 14 69 14 45 32 29 54 29c19 0 36 10 46 28 10-18 27-28 46-28 22 0 40 16 40 40 0 30-26 63-86 109Z" fill="#f9a8cd"/>
        <rect x="63" y="60" width="80" height="90" rx="13" fill="#fff" stroke="#f9a8cd" stroke-width="3" transform="rotate(-3 103 105)"/>
        <g transform="rotate(-3 103 105)"><circle cx="88" cy="88" r="3.4" fill="#2b2540"/><circle cx="118" cy="88" r="3.4" fill="#2b2540"/><path d="M94 97q9 9 18 0" fill="none" stroke="#2b2540" stroke-width="2.6" stroke-linecap="round"/><rect x="79" y="114" width="48" height="6" rx="3" fill="#b9a6f0"/></g>
        <path d="M172 6q2 16 18 18-16 2-18 18-2-16-18-18 16-2 18-18Z" fill="#b9a6f0"/>
      </svg>
    </section>

    <a class="btn btn--block" id="back" href="/join" style="margin-top:16px" hidden>로그인 화면으로 돌아가기</a>

    <form class="form" id="form" novalidate>
      <label class="field" id="nickRow" hidden>닉네임
        <input name="nickname" type="text" placeholder="2~20자, 나중에 바꿀 수 있어요" autocomplete="nickname" maxlength="20">
      </label>
      <label class="field">이메일
        <input name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" required>
      </label>
      <label class="field">비밀번호
        <input name="password" type="password" placeholder="8자 이상" autocomplete="current-password" minlength="8" required>
      </label>

      <button class="more" type="button" id="more" aria-expanded="false" aria-controls="first">
        처음이에요 · 초대장이 있어요
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="first" id="first" hidden>
        <label class="field">초대장 코드
          <input name="code" type="text" placeholder="링크로 들어오면 자동으로 채워져요" autocomplete="off" autocapitalize="characters" maxlength="20" spellcheck="false">
        </label>
        <p class="msg" id="codeMsg" role="status"></p>
        <p class="note" style="margin:0">초대장은 이미 가입한 팀원이 마이페이지에서 만들어 줘요.</p>
      </div>

      <div class="actions">
        <p class="msg msg--err" id="err" role="alert"></p>
        <button class="btn btn--block" type="submit" id="btn">들어가기</button>
        <button class="swap" type="button" id="swap" hidden></button>
      </div>
    </form>
  </div>
</main>
</div>
<script>
  TT.ready.then(() => {
    const $ = (s) => document.querySelector(s), form = $("#form");
    const norm = (v) => v.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
    const len = (s) => [...s.trim()].length;
    const TITLE = $("#gate-title").innerHTML, SUB = $("#gate-sub").textContent;

    // 화면 상태 — login: 이메일·비밀번호만 / manual: '처음이에요'를 눌러 코드까지 적는 중 / invite: 초대 링크로 들어옴(닉네임·이메일·비밀번호만)
    let mode = "login", invite = null;   // invite = {code, inviter} (링크의 초대장이 유효할 때)
    function setMode(m) {
      mode = m;
      const join = m !== "login";
      $("#nickRow").hidden = !join;
      $("#more").hidden = m === "invite";
      $("#more").setAttribute("aria-expanded", String(m === "manual"));
      $("#first").hidden = m !== "manual";
      $("#more").classList.remove("attn");
      form.password.autocomplete = join ? "new-password" : "current-password";
      $("#swap").hidden = !invite;
      if (invite) { $("#swap").textContent = m === "invite" ? "이미 가입했어요 · 로그인" : "초대장으로 가입하기"; form.code.value = m === "invite" ? invite.code : ""; }
      $("#err").textContent = "";
      if (m === "invite") {
        $("#gate-title").innerHTML = "T조에 초대받았어요";
        $("#gate-sub").textContent = (invite.inviter ? invite.inviter + "님이 초대했어요. " : "") + "닉네임·이메일·비밀번호만 정하면 바로 시작해요.";
      } else { $("#gate-title").innerHTML = TITLE; $("#gate-sub").textContent = SUB; }
      label();
    }
    // 버튼 글자: 초대 링크 = 시작하기 / 코드를 다 적은 첫 가입 = 가입하고 들어가기 / 그 밖 = 들어가기
    function label() { $("#btn").textContent = mode === "invite" ? "시작하기" : mode === "manual" && norm(form.code.value).length === 12 ? "가입하고 들어가기" : "들어가기"; }
    $("#more").addEventListener("click", () => setMode(mode === "manual" ? "login" : "manual"));
    $("#swap").addEventListener("click", () => setMode(mode === "invite" ? "login" : "invite"));

    // 직접 입력한 초대장 코드는 바로 확인해서 누가 보낸 초대장인지 보여 준다
    let last = "";
    async function check() {
      const c = norm(form.code.value), msg = $("#codeMsg");
      label();
      if (c === last) return; last = c;
      msg.className = "msg"; msg.textContent = "";
      if (c.length !== 12) return;
      try {
        const r = await TT.call("/api/invites?check=" + c);
        msg.className = r.valid ? "msg msg--ok" : "msg msg--err";
        msg.textContent = r.valid ? (r.inviter ? r.inviter + "님이 초대했어요." : "T조 운영자가 보낸 초대장이에요.") : "사용할 수 없는 초대장이에요. 이미 쓰였거나 기한이 지났을 수 있어요.";
      } catch (x) { msg.className = "msg msg--err"; msg.textContent = x.message; }
    }
    form.code.addEventListener("input", check);

    // 초대 링크(/join?code=…)로 들어왔으면 코드를 확인하고, 유효하면 바로 가입 화면으로 연다
    const fromLink = norm(new URLSearchParams(location.search).get("code") || "");
    if (fromLink.length === 12) form.hidden = true;   // 코드를 확인하는 동안 폼을 가려 로그인 화면이 깜박이지 않게 한다
    (async () => {
      if (fromLink.length === 12) {
        try {
          const r = await TT.call("/api/invites?check=" + fromLink);
          if (r.valid) invite = { code: fromLink, inviter: r.inviter || "" };
          else {   // 쓸 수 없는 초대장: 폼 대신 안내와 «로그인 화면으로 돌아가기» 버튼만 보여 준다
            $("#gate-title").innerHTML = "사용할 수 없는<br>초대장이에요";
            $("#gate-sub").textContent = "이미 쓰였거나 기한이 지난 초대장이에요. 새 초대장은 팀원에게 요청해 주세요.";
            $("#back").hidden = false;
            return;
          }
        } catch { invite = { code: fromLink, inviter: "" }; }   // 확인 실패 — 제출할 때 서버가 다시 검사한다
        form.hidden = false; setMode("invite"); form.nickname.focus();
      } else if (fromLink) { form.code.value = fromLink; setMode("manual"); check(); }
      else setMode("login");
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("#btn"), text = btn.textContent, err = $("#err"); err.textContent = "";
      const d = Object.fromEntries(new FormData(form)), email = d.email.trim(), code = norm(d.code || ""), nick = d.nickname || "";
      // 처음 가입하는 경우는 서버로 보내기 전에 빠진 곳을 알려 준다
      if (mode !== "login") {
        if (mode === "manual" && code.length !== 12) { err.textContent = "초대장 코드 12자리를 입력해 주세요."; return; }
        if (len(nick) < 2 || len(nick) > 20) { err.textContent = "닉네임은 2~20자로 정해 주세요."; return; }
        if (!email) { err.textContent = "이메일을 입력해 주세요."; return; }
        if (d.password.length < 8) { err.textContent = "비밀번호는 8자 이상으로 정해 주세요."; return; }
      } else if (!email || !d.password) { err.textContent = "이메일과 비밀번호를 입력해 주세요."; return; }
      btn.disabled = true; btn.textContent = "잠시만요…";
      try {
        // 초대 링크로 온 사람은 가입만(이미 가입한 이메일이면 그렇다고 알려 준다), 나머지는 로그인·가입을 알아서 고르는 enter
        await TT.call("/api/auth?a=" + (mode === "invite" ? "signup" : "enter"), "POST", { email, password: d.password, code, nickname: nick });
        location.href = "/";
      } catch (x) {
        err.textContent = x.message;
        if (mode === "login") $("#more").classList.add("attn");   // 처음이라면 여기를 누르라고 눈에 띄게
        btn.disabled = false; btn.textContent = text;
      }
    });
  });
</script>
</body>
</html>
