<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마이페이지 — HR T | 니핑 프로젝트</title>
<meta name="description" content="내 프로필과 초대장.">
<meta name="theme-color" content="#fff6fa">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-v2.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR T 니핑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/assets/icons/icon-v2-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<script src="/assets/shell.js"></script>
<main id="main">
  <section class="sec" aria-labelledby="me-title">
    <div class="wrap">
      <h1 class="sec__title" id="me-title">마이페이지</h1>
      <p class="sec__lead" id="me-lead"></p>

      <div class="me-card">
        <div class="me-cover" id="cover">
          <label class="cover-btn">커버 바꾸기
            <input id="coverFile" type="file" accept="image/*" aria-label="커버 사진 고르기">
          </label>
        </div>
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <p class="me-name" id="meName"></p>
        <p class="me-mail" id="meMail"></p>
        <label class="btn btn--ghost photo-btn">사진 바꾸기
          <input id="photo" type="file" accept="image/*" aria-label="프로필 사진 고르기">
        </label>
        <p class="msg msg--err" id="photoMsg" role="alert"></p>
        <p class="msg msg--err" id="coverMsg" role="alert"></p>
      </div>

      <form class="form me-sec" id="profForm" novalidate>
        <label class="field">닉네임
          <input name="nickname" id="nickInput" type="text" autocomplete="nickname" maxlength="20" required>
        </label>
        <label class="field">한 줄 소개 <small>T조 소개 페이지에 보여요 (60자까지)</small>
          <input name="bio" id="bioInput" type="text" maxlength="60" autocomplete="off">
        </label>
        <p class="msg" id="profMsg" role="status"></p>
        <button class="btn btn--block" type="submit" id="profBtn">저장</button>
      </form>

      <h2 class="sec__h3">초대장</h2>
      <p class="sec__lead" id="inv-lead" style="margin-top:6px">초대장으로만 새 팀원이 들어올 수 있어요.</p>
      <button class="btn btn--block" type="button" id="invNew" style="margin-top:14px">초대장 만들기</button>
      <p class="msg" id="invMsg" role="status" style="margin-top:8px"></p>
      <ul class="invs" id="invs"></ul>

      <section class="install" id="pushBox" aria-labelledby="push-title" hidden>
        <h2 id="push-title">새 글 알림</h2>
        <p id="pushLead"></p>
        <button class="btn btn--block" type="button" id="pushBtn" hidden></button>
        <p class="msg msg--err" id="pushMsg" role="alert"></p>
      </section>

      <section class="install" id="install" aria-labelledby="inst-title" hidden>
        <h2 id="inst-title">홈 화면에 추가</h2>
        <p id="instLead"></p>
        <p><b>안드로이드는 Chrome, 아이폰은 Safari</b> 브라우저로 이 사이트를 열어야 홈 화면에 추가할 수 있어요. 카카오톡·인스타그램 같은 앱 안의 브라우저에서는 안 돼요.</p>
        <ol id="instSteps" hidden></ol>
        <button class="btn btn--block" type="button" id="instBtn" hidden></button>
      </section>
    </div>
  </section>
</main>
</div>
<div class="crop" id="crop" role="dialog" aria-modal="true" aria-labelledby="cropTitle" hidden>
  <div class="crop__sheet">
    <h2 class="crop__title" id="cropTitle">사진 자르기</h2>
    <p class="crop__hint">사진을 끌어서 위치를 맞추고, 아래 막대나 두 손가락으로 크기를 조절해요.</p>
    <div class="crop__box" id="cropBox" tabindex="0" aria-label="자를 영역. 방향키로 이동, 더하기·빼기로 크기 조절"><canvas id="cropCv"></canvas></div>
    <label class="crop__zoom">확대 <input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1"></label>
    <div class="crop__btns"><button class="btn btn--ghost" type="button" id="cropCancel">취소</button><button class="btn" type="button" id="cropOk">적용</button></div>
  </div>
</div>
<script>
  TT.ready.then((user) => {
    if (!user) return;
    const $ = (s) => document.querySelector(s);
    const busy = (b, on, label) => { b.disabled = on; if (label) b.textContent = on ? "잠시만요…" : label; };

    function render(u) {
      TT.user = u; TT.setTabUser(u);
      $("#avatar").innerHTML = TT.avatar(u);
      $("#cover").classList.toggle("me-cover--img", !!u.coverUrl);
      $("#cover").style.backgroundImage = u.coverUrl ? `url("${u.coverUrl}")` : "";
      $("#meName").textContent = u.nickname; $("#meMail").textContent = u.email;
      $("#nickInput").value = u.nickname; $("#bioInput").value = u.bio || "";
      $("#me-lead").textContent = u.nickname + "님, 반가워요.";
    }
    render(user);

    $("#profForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("#profMsg"), btn = $("#profBtn"); msg.className = "msg"; msg.textContent = "";
      busy(btn, true, "저장");
      try { const { user: u } = await TT.call("/api/me", "PATCH", { nickname: $("#nickInput").value, bio: $("#bioInput").value }); render(u); msg.className = "msg msg--ok"; msg.textContent = "저장했어요."; }
      catch (x) { msg.className = "msg msg--err"; msg.textContent = x.message; }
      busy(btn, false, "저장");
    });

    // 사진을 고르면 «사진 자르기» 창이 열린다 — 끌어서 위치, 막대·휠·두 손가락으로 크기를 맞춘 뒤 «적용».
    // 보이는 그대로 JPEG 로 줄여 올린다(서버·R2 용량 절약). 프로필 = 256x256(동그랗게 보임), 커버 = 960x320(3:1).
    function crop(file, w, h, round) {
      return new Promise(async (resolve) => {
        let bmp;
        try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch { return resolve({ error: true }); }
        const dlg = $("#crop"), box = $("#cropBox"), cv = $("#cropCv"), zoomEl = $("#cropZoom");
        $("#cropTitle").textContent = round ? "프로필 사진 자르기" : "커버 사진 자르기";
        box.classList.toggle("crop__box--round", round);
        dlg.hidden = false; document.body.style.overflow = "hidden";
        const Bw = Math.min(360, dlg.querySelector(".crop__sheet").clientWidth - 36), Bh = Math.round((Bw * h) / w), dpr = Math.min(2, devicePixelRatio || 1);
        box.style.width = Bw + "px"; box.style.height = Bh + "px"; cv.width = Bw * dpr; cv.height = Bh * dpr;
        const s0 = Math.max(Bw / bmp.width, Bh / bmp.height);          // 상자를 꽉 채우는 기본 배율
        let z = 1, x = (Bw - bmp.width * s0) / 2, y = (Bh - bmp.height * s0) / 2;  // 확대 배율, 사진 왼쪽 위 위치
        const clamp = () => { const s = s0 * z; x = Math.min(0, Math.max(Bw - bmp.width * s, x)); y = Math.min(0, Math.max(Bh - bmp.height * s, y)); };
        const paint = (c, cw, ch) => { const s = s0 * z; c.fillStyle = "#fff"; c.fillRect(0, 0, cw, ch); c.drawImage(bmp, -x / s, -y / s, Bw / s, Bh / s, 0, 0, cw, ch); };
        const draw = () => { clamp(); paint(cv.getContext("2d"), cv.width, cv.height); };
        const setZoom = (nz) => {   // 상자 한가운데를 기준으로 확대·축소
          nz = Math.min(4, Math.max(1, nz)); const s = s0 * z, cx = (Bw / 2 - x) / s, cy = (Bh / 2 - y) / s;
          z = nz; x = Bw / 2 - cx * s0 * z; y = Bh / 2 - cy * s0 * z; zoomEl.value = z; draw();
        };
        zoomEl.value = 1; draw();

        const ptrs = new Map(); let pinch = 0;
        box.onpointerdown = (e) => { box.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; };
        box.onpointermove = (e) => {
          const p = ptrs.get(e.pointerId); if (!p) return; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
          if (ptrs.size === 1) { x += e.clientX - p[0]; y += e.clientY - p[1]; draw(); }
          else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) setZoom((z * d) / pinch); pinch = d; }
        };
        box.onpointerup = box.onpointercancel = (e) => { ptrs.delete(e.pointerId); pinch = 0; };
        box.onwheel = (e) => { e.preventDefault(); setZoom(z * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); };
        box.onkeydown = (e) => {   // 키보드: 방향키로 이동, +/- 로 크기
          const k = { ArrowLeft: [10, 0], ArrowRight: [-10, 0], ArrowUp: [0, 10], ArrowDown: [0, -10] }[e.key];
          if (k) { e.preventDefault(); x += k[0]; y += k[1]; draw(); } else if (e.key === "+" || e.key === "=") setZoom(z * 1.1); else if (e.key === "-") setZoom(z / 1.1);
        };
        zoomEl.oninput = () => setZoom(Number(zoomEl.value));

        const done = (v) => { dlg.hidden = true; document.body.style.overflow = ""; document.removeEventListener("keydown", onKey); bmp.close?.(); resolve(v); };
        const onKey = (e) => { if (e.key === "Escape") done(null); };
        document.addEventListener("keydown", onKey);
        $("#cropCancel").onclick = () => done(null);
        $("#cropOk").onclick = () => { const out = document.createElement("canvas"); out.width = w; out.height = h; paint(out.getContext("2d"), w, h); done({ url: out.toDataURL("image/jpeg", 0.85) }); };
        $("#cropOk").focus();
      });
    }
    function picker(input, msgSel, url, w, h, round) {
      input.addEventListener("change", async (e) => {
        const f = e.target.files[0], msg = $(msgSel); msg.textContent = "";
        e.target.value = "";                       // 같은 사진을 다시 골라도 반응하도록
        if (!f) return;
        const r = await crop(f, w, h, round);
        if (!r) return;                            // 취소
        if (r.error) { msg.textContent = "이 사진은 열 수 없어요. 다른 사진으로 해 보세요."; return; }
        try { const { user: u } = await TT.call(url, "POST", { image: r.url }); render(u); }
        catch (x) { msg.textContent = x.message || "사진을 올리지 못했어요. 다른 사진으로 해 보세요."; }
      });
    }
    picker($("#photo"), "#photoMsg", "/api/photo", 256, 256, true);
    picker($("#coverFile"), "#coverMsg", "/api/photo?k=cover", 960, 320, false);

    // ── 새 글 폰 알림(웹 푸시) — 이 기기에서 켜고 끈다 ──
    (async () => {
      const box = $("#pushBox"), lead = $("#pushLead"), btn = $("#pushBtn"), msg = $("#pushMsg");
      const ua = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
      box.hidden = false;
      if (!("serviceWorker" in navigator && "PushManager" in window && "Notification" in window)) {
        lead.textContent = ios && !standalone ? "아이폰은 Safari에서 이 사이트를 홈 화면에 추가한 뒤, 추가된 앱을 열어서 켤 수 있어요. 아래 «홈 화면에 추가» 안내를 먼저 따라 해 주세요."
          : /KAKAOTALK/i.test(ua) ? "카카오톡 안 브라우저에서는 켤 수 없어요. 안드로이드는 Chrome, 아이폰은 Safari로 열어 홈 화면에 추가한 뒤 켜 주세요."
          : "이 브라우저는 폰 알림을 지원하지 않아요. 안드로이드는 Chrome, 아이폰은 홈 화면에 추가한 앱에서 켜 주세요.";
        return;
      }
      lead.textContent = "알림을 준비하고 있어요…";
      const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((r) => setTimeout(() => r(null), 6000))]).catch(() => null);   // 서비스워커가 등록되지 못하면 ready 가 영영 안 끝난다
      if (!reg) { lead.textContent = "알림을 준비하지 못했어요. 페이지를 새로고침하거나 잠시 뒤 다시 열어 주세요."; return; }
      const key = (b64) => Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/")), (c) => c.charCodeAt(0));
      async function draw() {
        const on = !!(await reg.pushManager.getSubscription()) && Notification.permission === "granted";
        lead.textContent = on ? "새 글이 올라오면 이 기기로 알림이 와요. 앱을 열어 두지 않아도 받아요." : "새 글이 올라오면 앱을 열지 않아도 이 폰으로 알림을 받아요.";
        btn.textContent = on ? "새 글 알림 끄기" : "새 글 알림 켜기"; btn.classList.toggle("btn--ghost", on); btn.dataset.on = on; btn.hidden = false;
      }
      btn.addEventListener("click", async () => {
        msg.textContent = ""; btn.disabled = true;
        try {
          const sub = await reg.pushManager.getSubscription();
          if (btn.dataset.on === "true") {
            if (sub) { await TT.call("/api/push", "DELETE", { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
          } else {
            if ((await Notification.requestPermission()) !== "granted") { msg.textContent = "알림이 차단돼 있어요. 브라우저(또는 폰) 설정에서 이 사이트의 알림을 허용해 주세요."; return; }
            const { publicKey } = await TT.call("/api/push");
            const s = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key(publicKey) });
            await TT.call("/api/push", "POST", { subscription: s.toJSON() });
          }
        } catch (x) { msg.textContent = x.message || "알림을 바꾸지 못했어요. 잠시 뒤 다시 시도해 주세요."; }
        finally { btn.disabled = false; await draw(); }
      });
      draw();
    })();

    // ── 홈 화면에 추가(PWA) ──
    (() => {
      const ua = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const android = /android/i.test(ua), kakao = /KAKAOTALK/i.test(ua);
      if (matchMedia("(display-mode: standalone)").matches || navigator.standalone) return; // 이미 앱으로 열었으면 안내하지 않는다
      const box = $("#install"), lead = $("#instLead"), steps = $("#instSteps"), btn = $("#instBtn");
      const list = (a) => { steps.innerHTML = a.map((s) => `<li>${s}</li>`).join(""); steps.hidden = false; };
      function show() {
        btn.hidden = true; steps.hidden = true; btn.onclick = null;
        if (kakao) {
          lead.textContent = `카카오톡 안에서는 홈 화면에 추가할 수 없어요. ${ios ? "Safari" : "Chrome"}에서 열어 주세요. (이 브라우저와 로그인은 따로라, 다시 로그인해야 해요.)`;
          btn.textContent = `${ios ? "Safari" : "Chrome"}로 열기`; btn.hidden = false;
          btn.onclick = () => { location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.origin + "/me"); };
        } else if (TT.installEv) {
          lead.textContent = "앱처럼 바탕화면에서 바로 열 수 있어요.";
          btn.textContent = "홈 화면에 추가하기"; btn.hidden = false;
          btn.onclick = async () => { const ev = TT.installEv; TT.installEv = null; ev.prompt(); await ev.userChoice.catch(() => {}); show(); };
        } else if (ios) {
          lead.textContent = "앱처럼 바탕화면에서 바로 열 수 있어요. Safari에서 아래 순서로 해 주세요.";
          list(["화면 아래(또는 위) <b>공유</b> 버튼(네모에 위쪽 화살표)을 눌러요.", "<b>홈 화면에 추가</b>를 골라요.", "오른쪽 위 <b>추가</b>를 누르면 끝이에요."]);
        } else if (android) {
          lead.textContent = "앱처럼 바탕화면에서 바로 열 수 있어요. Chrome에서 아래 순서로 해 주세요.";
          list(["오른쪽 위 <b>⋮</b> 메뉴를 눌러요.", "<b>홈 화면에 추가</b>(또는 <b>앱 설치</b>)를 골라요.", "<b>추가</b>(또는 <b>설치</b>)를 누르면 끝이에요."]);
        } else return;
        box.hidden = false;
      }
      show();
      document.addEventListener("tt-install", show);
      addEventListener("appinstalled", () => { box.hidden = true; });
    })();

    // ── 초대장 ──
    const fmt = (c) => c.match(/.{1,4}/g).join("-");
    const link = (c) => location.origin + "/join?code=" + c;
    const left = (d) => Math.max(0, Math.ceil((new Date(d) - Date.now()) / 864e5));
    async function loadInv() {
      try {
        const r = await TT.call("/api/invites");
        $("#inv-lead").textContent = `초대장으로만 새 팀원이 들어올 수 있어요. 한 번 쓰면 사라지고 ${r.days}일 안에 써야 해요. 쓰지 않은 초대장은 ${r.max}장까지 가질 수 있어요.`;
        $("#invs").innerHTML = r.invites.map((i) => {
          if (i.status === "active") return `<li class="inv inv--active" data-id="${i.id}" data-code="${TT.esc(i.code)}">
            <div class="inv__top"><span class="inv__code">${TT.esc(fmt(i.code))}</span><span class="inv__state">${left(i.expiresAt)}일 남음</span></div>
            <div class="inv__act"><button class="btn btn--sm" data-act="copy" type="button">링크 복사</button>${navigator.share ? '<button class="btn btn--ghost btn--sm" data-act="share" type="button">공유</button>' : ""}<button class="btn btn--ghost btn--sm" data-act="revoke" type="button">취소</button></div></li>`;
          const t = i.status === "used" ? `${TT.esc(i.usedBy || "팀원")}님이 가입했어요` : i.status === "revoked" ? "취소한 초대장" : "기한이 지난 초대장";
          return `<li class="inv inv--done"><div class="inv__top"><span class="inv__state">${t}</span></div></li>`;
        }).join("");
      } catch (x) { $("#invMsg").className = "msg msg--err"; $("#invMsg").textContent = x.message; }
    }
    loadInv();

    $("#invNew").addEventListener("click", async (e) => {
      const btn = e.currentTarget, msg = $("#invMsg"); msg.className = "msg"; msg.textContent = "";
      busy(btn, true, "초대장 만들기");
      try { await TT.call("/api/invites", "POST", {}); await loadInv(); msg.className = "msg msg--ok"; msg.textContent = "초대장을 만들었어요. 링크를 복사해서 보내 주세요."; }
      catch (x) { msg.className = "msg msg--err"; msg.textContent = x.message; }
      busy(btn, false, "초대장 만들기");
    });

    $("#invs").addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-act]"); if (!b) return;
      const li = b.closest("li"), msg = $("#invMsg"); msg.className = "msg"; msg.textContent = "";
      const url = link(li.dataset.code);
      try {
        if (b.dataset.act === "copy") {
          try { await navigator.clipboard.writeText(url); msg.className = "msg msg--ok"; msg.textContent = "링크를 복사했어요."; }
          catch { prompt("아래 링크를 복사해 주세요", url); }
        } else if (b.dataset.act === "share") {
          await navigator.share({ title: "HR T | 니핑 초대장", text: "HR T | 니핑 프로젝트에 초대합니다.", url });
        } else if (b.dataset.act === "revoke") {
          if (!confirm("이 초대장을 취소할까요? 링크는 더 이상 쓸 수 없어요.")) return;
          await TT.call("/api/invites?id=" + li.dataset.id, "DELETE", {}); await loadInv();
        }
      } catch (x) { if (x.name !== "AbortError") { msg.className = "msg msg--err"; msg.textContent = x.message; } }
    });
  });
</script>
</body>
