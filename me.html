<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마이페이지 — HR T | 니핑 프로젝트</title>
<meta name="description" content="내 프로필·알림·초대장.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HR T | 니핑">
<meta property="og:title" content="HR T | 니핑 프로젝트">
<meta property="og:description" content="초대장을 전달받아 놀러 오세요💌">
<meta property="og:image" content="https://tnieping.com/assets/og-v3.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="HR 고민, 티 내도 괜찮아요 — 라벤더 마스코트">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fff6fa">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-v3.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR T 니핑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/assets/icons/icon-v3-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="app">
<script src="/assets/shell.js"></script>
<main id="main">
  <section class="sec" aria-labelledby="me-title">
    <div class="wrap">
      <h1 class="sec__title" id="me-title">마이페이지</h1>
      <p class="sec__lead" id="me-lead"></p>

      <div class="me-card">
        <div class="me-cover" id="cover">
          <label class="cover-btn">커버 바꾸기
            <input id="coverFile" type="file" accept="image/*" aria-label="커버 사진 고르기">
          </label>
        </div>
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <p class="me-name" id="meName"></p>
        <p class="me-mail" id="meMail"></p>
        <label class="btn btn--ghost photo-btn">사진 바꾸기
          <input id="photo" type="file" accept="image/*" aria-label="프로필 사진 고르기">
        </label>
        <p class="msg msg--err" id="photoMsg" role="alert"></p>
        <p class="msg msg--err" id="coverMsg" role="alert"></p>
      </div>

      <!-- 바로가기: T조 소개·회의록·발표(발표자 5명에게만)·로그아웃. 상단바에서 옮겨 왔고, 새 소식이 있으면 카드 오른쪽 위에 개수가 뜬다(하단 «마이페이지» 에도 합계) -->
      <nav class="tiles" id="tiles" aria-label="바로가기"></nav>

      <!-- 포인트: 올해 점수(해가 바뀌면 0 에서 다시 시작)·누적·올해 순위·받는 방법·최근 적립. 규칙 숫자는 서버(api/_points.js)가 내려준다 -->
      <section class="pt" id="ptBox" aria-label="포인트" hidden>
        <!-- 평소엔 점수만 보이고, 누르면 순위표·최근 적립·받는 방법이 드롭다운으로 펼쳐진다(처음부터 다 펼쳐 두지 않는다) -->
        <button class="pt__top" type="button" id="ptTop" aria-expanded="false" aria-controls="ptBody">
          <span class="pt__head"><span class="pt__ttl">포인트</span><span class="pt__rank" id="ptRank"></span><i class="pt__chev" aria-hidden="true"></i></span>
          <span class="pt__big"><b id="ptYear">0</b><span>점</span><small id="ptSub"></small></span>
        </button>
        <div class="pt__body" id="ptBody"><div class="pt__in">
          <ol class="pt__board" id="ptBoard" aria-label="올해 포인트 순위"></ol>
          <ul class="pt__log" id="ptLog" aria-label="최근에 받은 포인트"></ul>
          <details class="pt__how"><summary>포인트는 어떻게 받나요?</summary><ul id="ptHow"></ul></details>
        </div></div>
      </section>

    </div>
  </section>
</main>
</div>
<!-- 바로가기 카드에서 여는 창: 평소엔 숨겨 두고 누르면 아래에서 올라온다 -->
<div class="sh" id="sh-prof" role="dialog" aria-modal="true" aria-labelledby="sh-prof-t" hidden>
  <div class="sh__box">
    <div class="sh__head"><h2 class="sh__t" id="sh-prof-t">정보 변경</h2><button class="sh__x" type="button" data-x aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <form class="form" id="profForm" novalidate>
    <label class="field">닉네임
      <input name="nickname" id="nickInput" type="text" autocomplete="nickname" maxlength="20" required>
    </label>
    <label class="field">한 줄 소개 <small>T조 소개 페이지에 보여요 (60자까지)</small>
      <input name="bio" id="bioInput" type="text" maxlength="60" autocomplete="off">
    </label>
    <p class="msg" id="profMsg" role="status"></p>
    <button class="btn btn--block" type="submit" id="profBtn">저장</button>
  </form>
  </div>
</div>
<div class="sh" id="sh-push" role="dialog" aria-modal="true" aria-labelledby="sh-push-t" hidden>
  <div class="sh__box">
    <div class="sh__head"><h2 class="sh__t" id="sh-push-t">폰 알림</h2><button class="sh__x" type="button" data-x aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <section class="set" id="pushBox" aria-labelledby="push-title" hidden>
    <div class="set__row">
      <span class="set__ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg></span>
      <div class="set__t"><h2 id="push-title">폰 알림</h2><p id="pushState">알림을 준비하고 있어요…</p></div>
      <button class="sw" type="button" id="pushSw" role="switch" aria-checked="false" aria-labelledby="push-title" hidden><span class="sw__k"></span></button>
    </div>
    <ul class="set__chips" aria-label="알려 주는 것"><li>새 글</li><li>내 글의 댓글</li><li>내 댓글의 답글</li><li>좋아요</li></ul>
    <p class="set__note" id="pushLead"></p>
    <p class="msg msg--err" id="pushMsg" role="alert"></p>
  </section>
  </div>
</div>
<div class="sh" id="sh-inv" role="dialog" aria-modal="true" aria-labelledby="sh-inv-t" hidden>
  <div class="sh__box">
    <div class="sh__head"><h2 class="sh__t" id="sh-inv-t">초대장</h2><button class="sh__x" type="button" data-x aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <p class="sec__lead" id="inv-lead">초대장으로만 새 팀원이 들어올 수 있어요.</p>
  <button class="btn btn--block" type="button" id="invNew" style="margin-top:14px">초대장 만들기</button>
  <p class="msg" id="invMsg" role="status" style="margin-top:8px"></p>
  <ul class="invs" id="invs"></ul>
  </div>
</div>
<div class="crop" id="crop" role="dialog" aria-modal="true" aria-labelledby="cropTitle" hidden>
  <div class="crop__sheet">
    <h2 class="crop__title" id="cropTitle">사진 자르기</h2>
    <p class="crop__hint">사진을 끌어서 위치를 맞추고, 아래 막대나 두 손가락으로 크기를 조절해요.</p>
    <div class="crop__box" id="cropBox" tabindex="0" aria-label="자를 영역. 방향키로 이동, 더하기·빼기로 크기 조절"><canvas id="cropCv"></canvas></div>
    <label class="crop__zoom">확대 <input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1"></label>
    <div class="crop__btns"><button class="btn btn--ghost" type="button" id="cropCancel">취소</button><button class="btn" type="button" id="cropOk">적용</button></div>
  </div>
</div>
<script>
  TT.ready.then((user) => {
    if (!user) return;
    const $ = (s) => document.querySelector(s);
    const busy = (b, on, label) => { b.disabled = on; if (label) b.textContent = on ? "잠시만요…" : label; };

    function render(u) {
      TT.user = u; TT.setTabUser(u);
      $("#avatar").innerHTML = TT.avatar(u);
      $("#cover").classList.toggle("me-cover--img", !!u.coverUrl);
      $("#cover").style.backgroundImage = u.coverUrl ? `url("${u.coverUrl}")` : "";
      $("#meName").textContent = u.nickname; $("#meMail").textContent = u.email;
      $("#nickInput").value = u.nickname; $("#bioInput").value = u.bio || "";
      $("#me-lead").textContent = u.nickname + "님, 반가워요.";
    }
    render(user);

    // 바로가기 카드 — 회의록·발표는 발표자에게만, 로그아웃은 모두. 새 소식 숫자는 shell.js(TT.alerts)가 계산하고 바뀔 때마다 여기서 다시 그린다.
    const tilesEl = $("#tiles"), IC = TT.icons;
    const tile = (id, ic, label, hint, n, tag = "button", href = "", cls = "") =>
      `<${tag} class="tile${cls ? " " + cls : ""}" id="${id}" ${tag === "a" ? `href="${href}"` : 'type="button"'}${n ? ` aria-label="${label}, 새 소식 ${n}개"` : ""}>${cls.includes("tile--prem") ? '<em class="tile__badge">설립멤버</em>' : ""}<span class="tile__ic">${ic}</span><b class="tile__t">${label}</b><span class="tile__h">${hint}</span>${n ? `<i class="tile__n" aria-hidden="true">${n > 99 ? "99+" : n}</i>` : ""}</${tag}>`;
    // 알림은 이 기기에서 아직 안 켠 사람에게만 카드가 계속 흔들린다(TT.pushOn: null = 아직 모름, true/false). 로그아웃은 중요해서 맨 마지막 줄에 넓게 둔다.
    function drawTiles() {
      const a = TT.alerts, off = TT.pushOn === false;
      tilesEl.innerHTML =
        tile("tTeam", IC.team, "T조 소개", "팀원 만나보기", 0, "a", "/team") +
        tile("tPush", IC.bell, "알림", off ? "꺼져 있어요 · 눌러서 켜기" : TT.pushOn ? "켜져 있어요" : "폰 알림 설정", 0, "button", "", off ? "tile--shake" : "") +
        tile("tInv", IC.mail, "초대장", "새 팀원 초대하기", 0) +
        tile("tProf", IC.edit, "정보 변경", "닉네임·한 줄 소개", 0) +
        (user.presenter ? tile("tMin", IC.mic, "회의록", a.minutes ? `새 회의록 ${a.minutes}개` : "회의 요약·전사", a.minutes, "a", "/minutes", "tile--prem") + tile("tPre", IC.present, "발표", a.deck ? "발표 자료가 바뀌었어요" : "전체화면 발표", a.deck, "button", "", "tile--prem") : "") +
        tile("tOut", IC.out, "로그아웃", "이 기기에서 나가기", 0, "button", "", "tile--out");
    }
    // 창(정보 변경·알림·초대장): 누르면 아래에서 올라오고, 바깥·✕·Esc 로 닫는다
    let shEl = null, shFrom = null;
    const onSh = (e) => { if (e.key === "Escape") shClose(); };
    function shOpen(id) { shFrom = document.activeElement; shEl = $("#" + id); shEl.hidden = false; document.body.style.overflow = "hidden"; document.addEventListener("keydown", onSh); shEl.querySelector(".sh__x").focus(); }
    function shClose() { if (!shEl) return; shEl.hidden = true; shEl = null; document.body.style.overflow = ""; document.removeEventListener("keydown", onSh); shFrom?.focus?.(); }
    document.querySelectorAll(".sh").forEach((el) => el.addEventListener("click", (e) => { if (e.target === el || e.target.closest("[data-x]")) shClose(); }));
    const SHEET = { tPush: "sh-push", tInv: "sh-inv", tProf: "sh-prof" };
    tilesEl.addEventListener("click", (e) => { const t = e.target.closest(".tile"); if (!t) return; if (t.id === "tPre") TT.present(); else if (t.id === "tOut") TT.askLogout(); else if (SHEET[t.id]) shOpen(SHEET[t.id]); });
    // 발표 카드의 «새 소식»은 눌러서 열어 보지 않아도, 카드가 화면에 2.5초쯤 보였으면 본 것으로 친다(예전엔 발표를 열어야만 사라져서 계속 남아 있었다).
    let deckWatch = null, deckT = 0;
    function watchDeck() {
      deckWatch?.disconnect(); clearTimeout(deckT);
      const el = $("#tPre"); if (!el || !TT.alerts.deck || !("IntersectionObserver" in window)) return;
      deckWatch = new IntersectionObserver((es) => { clearTimeout(deckT); if (es[0].isIntersecting) deckT = setTimeout(() => TT.seen.deck(), 2500); }, { threshold: 0.6 });
      deckWatch.observe(el);
    }
    drawTiles(); watchDeck();
    document.addEventListener("tt:alerts", () => { drawTiles(); watchDeck(); });

    // 포인트 카드 — 서버에서 받아 그린다(실패하면 카드는 그냥 숨겨 둔다)
    TT.call("/api/points").then((d) => {
      const R = d.rules, e = TT.esc;
      $("#ptYear").textContent = d.me.year; $("#ptRank").textContent = `${d.year}년 ${d.me.rank}위`;
      $("#ptSub").textContent = `${d.year}년 포인트 · 누적 ${d.me.total}점`;
      $("#ptBoard").innerHTML = d.board.map((b) => `<li class="pt__row${b.me ? " is-me" : ""}"><span class="pt__no">${b.rank}</span>${TT.chip(b)}<b class="pt__pt">${b.year}<small>점</small></b></li>`).join("");
      const past = d.years.filter((y) => y.year !== d.year);
      $("#ptLog").innerHTML = d.recent.length
        ? d.recent.map((r) => `<li><a href="/article?id=${r.postId}"><span class="pt__lab">${e(r.label)}${r.title ? `<small>${e(r.title)}</small>` : ""}</span><b>+${r.pts}</b><time>${TT.when(r.at)}</time></a></li>`).join("") + (past.length ? `<li class="pt__past">지난 기록 · ${past.map((y) => `${y.year}년 ${y.pts}점`).join(" · ")}</li>` : "")
        : `<li class="pt__none">아직 받은 포인트가 없어요. 오늘의 질문과 주간 토론에 참여해 보세요.</li>`;
      $("#ptHow").innerHTML = [
        `<li><b>오늘의 질문</b> 지목된 날 제대로 답하면 <em>+${R.DAILY}</em> (공백 빼고 ${R.DAILY_MIN}자 이상)</li>`,
        `<li><b>주간 토론 참여</b> 댓글을 하나라도 남기면 <em>+${R.JOIN}</em>, 하나도 없으면 0점</li>`,
        `<li><b>댓글 최다</b> 의미 있는 댓글(공백 빼고 ${R.TOP_MIN}자 이상)을 가장 많이 남기면 <em>+${R.TOP}</em></li>`,
        `<li><b>핵심 역할</b> 토론이 끝날 때 미드핑이 대화의 흐름과 결론에 핵심적이었다고 판단하면 <em>+${R.KEY}</em> (최대 ${R.KEY_MAX}명)</li>`,
        `<li>주간 토론 점수는 AI가 토론을 아티클로 정리할 때 한꺼번에 들어와요. 올해 점수는 해마다 새로 시작하고, 누적 기록은 남아요.</li>`,
      ].join("");
      $("#ptBox").hidden = false;
    }).catch(() => {});
    $("#ptTop").addEventListener("click", () => { const on = $("#ptBox").classList.toggle("is-open"); $("#ptTop").setAttribute("aria-expanded", on); });

    $("#profForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $("#profMsg"), btn = $("#profBtn"); msg.className = "msg"; msg.textContent = "";
      busy(btn, true, "저장");
      try { const { user: u } = await TT.call("/api/me", "PATCH", { nickname: $("#nickInput").value, bio: $("#bioInput").value }); render(u); msg.className = "msg msg--ok"; msg.textContent = "저장했어요."; }
      catch (x) { msg.className = "msg msg--err"; msg.textContent = x.message; }
      busy(btn, false, "저장");
    });

    // 사진을 고르면 «사진 자르기» 창이 열린다 — 끌어서 위치, 막대·휠·두 손가락으로 크기를 맞춘 뒤 «적용».
    // 보이는 그대로 JPEG 로 줄여 올린다(서버·R2 용량 절약). 프로필 = 256x256(동그랗게 보임), 커버 = 960x320(3:1).
    function crop(file, w, h, round) {
      return new Promise(async (resolve) => {
        let bmp;
        try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); } catch { return resolve({ error: true }); }
        const dlg = $("#crop"), box = $("#cropBox"), cv = $("#cropCv"), zoomEl = $("#cropZoom");
        $("#cropTitle").textContent = round ? "프로필 사진 자르기" : "커버 사진 자르기";
        box.classList.toggle("crop__box--round", round);
        dlg.hidden = false; document.body.style.overflow = "hidden";
        const Bw = Math.min(360, dlg.querySelector(".crop__sheet").clientWidth - 36), Bh = Math.round((Bw * h) / w), dpr = Math.min(2, devicePixelRatio || 1);
        box.style.width = Bw + "px"; box.style.height = Bh + "px"; cv.width = Bw * dpr; cv.height = Bh * dpr;
        const s0 = Math.max(Bw / bmp.width, Bh / bmp.height);          // 상자를 꽉 채우는 기본 배율
        let z = 1, x = (Bw - bmp.width * s0) / 2, y = (Bh - bmp.height * s0) / 2;  // 확대 배율, 사진 왼쪽 위 위치
        const clamp = () => { const s = s0 * z; x = Math.min(0, Math.max(Bw - bmp.width * s, x)); y = Math.min(0, Math.max(Bh - bmp.height * s, y)); };
        const paint = (c, cw, ch) => { const s = s0 * z; c.fillStyle = "#fff"; c.fillRect(0, 0, cw, ch); c.drawImage(bmp, -x / s, -y / s, Bw / s, Bh / s, 0, 0, cw, ch); };
        const draw = () => { clamp(); paint(cv.getContext("2d"), cv.width, cv.height); };
        const setZoom = (nz) => {   // 상자 한가운데를 기준으로 확대·축소
          nz = Math.min(4, Math.max(1, nz)); const s = s0 * z, cx = (Bw / 2 - x) / s, cy = (Bh / 2 - y) / s;
          z = nz; x = Bw / 2 - cx * s0 * z; y = Bh / 2 - cy * s0 * z; zoomEl.value = z; draw();
        };
        zoomEl.value = 1; draw();

        const ptrs = new Map(); let pinch = 0;
        box.onpointerdown = (e) => { box.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; };
        box.onpointermove = (e) => {
          const p = ptrs.get(e.pointerId); if (!p) return; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
          if (ptrs.size === 1) { x += e.clientX - p[0]; y += e.clientY - p[1]; draw(); }
          else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) setZoom((z * d) / pinch); pinch = d; }
        };
        box.onpointerup = box.onpointercancel = (e) => { ptrs.delete(e.pointerId); pinch = 0; };
        box.onwheel = (e) => { e.preventDefault(); setZoom(z * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); };
        box.onkeydown = (e) => {   // 키보드: 방향키로 이동, +/- 로 크기
          const k = { ArrowLeft: [10, 0], ArrowRight: [-10, 0], ArrowUp: [0, 10], ArrowDown: [0, -10] }[e.key];
          if (k) { e.preventDefault(); x += k[0]; y += k[1]; draw(); } else if (e.key === "+" || e.key === "=") setZoom(z * 1.1); else if (e.key === "-") setZoom(z / 1.1);
        };
        zoomEl.oninput = () => setZoom(Number(zoomEl.value));

        const done = (v) => { dlg.hidden = true; document.body.style.overflow = ""; document.removeEventListener("keydown", onKey); bmp.close?.(); resolve(v); };
        const onKey = (e) => { if (e.key === "Escape") done(null); };
        document.addEventListener("keydown", onKey);
        $("#cropCancel").onclick = () => done(null);
        $("#cropOk").onclick = () => { const out = document.createElement("canvas"); out.width = w; out.height = h; paint(out.getContext("2d"), w, h); done({ url: out.toDataURL("image/jpeg", 0.85) }); };
        $("#cropOk").focus();
      });
    }
    function picker(input, msgSel, url, w, h, round) {
      input.addEventListener("change", async (e) => {
        const f = e.target.files[0], msg = $(msgSel); msg.textContent = "";
        e.target.value = "";                       // 같은 사진을 다시 골라도 반응하도록
        if (!f) return;
        const r = await crop(f, w, h, round);
        if (!r) return;                            // 취소
        if (r.error) { msg.textContent = "이 사진은 열 수 없어요. 다른 사진으로 해 보세요."; return; }
        try { const { user: u } = await TT.call(url, "POST", { image: r.url }); render(u); }
        catch (x) { msg.textContent = x.message || "사진을 올리지 못했어요. 다른 사진으로 해 보세요."; }
      });
    }
    picker($("#photo"), "#photoMsg", "/api/photo", 256, 256, true);
    picker($("#coverFile"), "#coverMsg", "/api/photo?k=cover", 960, 320, false);

    // ── 폰 알림(웹 푸시) — 이 기기에서 스위치로 켜고 끈다. 로직은 shell.js 의 TT.push ──
    (async () => {
      const box = $("#pushBox"), state = $("#pushState"), lead = $("#pushLead"), sw = $("#pushSw"), msg = $("#pushMsg");
      const ua = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
      box.hidden = false;
      const known = (on) => { TT.pushOn = on; drawTiles(); };
      if (!TT.push.supported()) {
        known(false);
        state.textContent = "이 기기에서는 켤 수 없어요";
        lead.textContent = ios && !standalone ? "아이폰은 Safari에서 이 사이트를 홈 화면에 추가한 뒤, 추가된 앱을 열어서 켤 수 있어요."
          : /KAKAOTALK/i.test(ua) ? "카카오톡 안 브라우저에서는 켤 수 없어요. 안드로이드는 Chrome, 아이폰은 Safari로 열어 홈 화면에 추가한 뒤 켜 주세요."
          : "이 브라우저는 폰 알림을 지원하지 않아요. 안드로이드는 Chrome, 아이폰은 홈 화면에 추가한 앱에서 켜 주세요.";
        return;
      }
      async function draw() {
        const st = await TT.push.state();
        if (st === "unsupported") { known(false); state.textContent = "준비하지 못했어요"; lead.textContent = "페이지를 새로고침하거나 잠시 뒤 다시 열어 주세요."; return; }
        const on = st === "on"; known(on);
        state.textContent = st === "denied" ? "차단됨" : on ? "켜짐 — 이 기기로 알림이 와요" : "꺼짐";
        lead.textContent = st === "denied" ? "알림이 차단돼 있어요. 폰(또는 브라우저) 설정에서 이 사이트의 알림을 허용한 뒤 다시 열어 주세요."
          : on ? "앱을 열어 두지 않아도 받고, 홈 화면 아이콘 위에 안 읽은 알림 수가 떠요."
          : "스위치를 켜면 위 소식을 앱을 열지 않아도 이 폰으로 받아요.";
        sw.setAttribute("aria-checked", String(on)); sw.hidden = st === "denied";
      }
      // 스위치는 누르는 순간 바뀐 모습으로 먼저 보여 주고, 구독 등록·해제는 뒤에서 한다. 끝나면(또는 실패하면) 실제 상태로 조용히 맞춘다.
      let pushBusy = false;
      sw.addEventListener("click", async () => {
        if (pushBusy) return; pushBusy = true; msg.textContent = "";
        const was = sw.getAttribute("aria-checked") === "true", next = !was;
        sw.setAttribute("aria-checked", String(next));
        state.textContent = next ? "켜짐 — 이 기기로 알림이 와요" : "꺼짐";
        try { if (was) await TT.push.disable(); else await TT.push.enable(); }
        catch (x) { msg.textContent = x.message || "알림을 바꾸지 못했어요. 잠시 뒤 다시 시도해 주세요."; }
        finally { pushBusy = false; await draw(); }
      });
      draw();
    })();
    // ── 초대장 ──
    const fmt = (c) => c.match(/.{1,4}/g).join("-");
    const link = (c) => location.origin + "/join?code=" + c;
    const left = (d) => Math.max(0, Math.ceil((new Date(d) - Date.now()) / 864e5));
    async function loadInv() {
      try {
        const r = await TT.call("/api/invites");
        $("#inv-lead").textContent = `초대장으로만 새 팀원이 들어올 수 있어요. 한 번 쓰면 사라지고 ${r.days}일 안에 써야 해요. 쓰지 않은 초대장은 ${r.max}장까지 가질 수 있어요.`;
        $("#invs").innerHTML = r.invites.map((i) => {
          if (i.status === "active") return `<li class="inv inv--active" data-id="${i.id}" data-code="${TT.esc(i.code)}">
            <div class="inv__top"><span class="inv__code">${TT.esc(fmt(i.code))}</span><span class="inv__state">${left(i.expiresAt)}일 남음</span></div>
            <div class="inv__act"><button class="btn btn--sm" data-act="copy" type="button">링크 복사</button>${navigator.share ? '<button class="btn btn--ghost btn--sm" data-act="share" type="button">공유</button>' : ""}<button class="btn btn--ghost btn--sm" data-act="revoke" type="button">취소</button></div></li>`;
          const t = i.status === "used" ? `${TT.esc(i.usedBy || "팀원")}님이 가입했어요` : i.status === "revoked" ? "취소한 초대장" : "기한이 지난 초대장";
          return `<li class="inv inv--done"><div class="inv__top"><span class="inv__state">${t}</span></div></li>`;
        }).join("");
      } catch (x) { $("#invMsg").className = "msg msg--err"; $("#invMsg").textContent = x.message; }
    }
    loadInv();

    $("#invNew").addEventListener("click", async (e) => {
      const btn = e.currentTarget, msg = $("#invMsg"); msg.className = "msg"; msg.textContent = "";
      busy(btn, true, "초대장 만들기");
      try { await TT.call("/api/invites", "POST", {}); await loadInv(); msg.className = "msg msg--ok"; msg.textContent = "초대장을 만들었어요. 링크를 복사해서 보내 주세요."; }
      catch (x) { msg.className = "msg msg--err"; msg.textContent = x.message; }
      busy(btn, false, "초대장 만들기");
    });

    $("#invs").addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-act]"); if (!b) return;
      const li = b.closest("li"), msg = $("#invMsg"); msg.className = "msg"; msg.textContent = "";
      const url = link(li.dataset.code);
      try {
        if (b.dataset.act === "copy") {
          try { await navigator.clipboard.writeText(url); msg.className = "msg msg--ok"; msg.textContent = "링크를 복사했어요."; }
          catch { prompt("아래 링크를 복사해 주세요", url); }
        } else if (b.dataset.act === "share") {
          await navigator.share({ title: "HR T | 니핑 초대장", text: "HR T | 니핑 프로젝트에 초대합니다.", url });
        } else if (b.dataset.act === "revoke") {
          if (!confirm("이 초대장을 취소할까요? 링크는 더 이상 쓸 수 없어요.")) return;
          await TT.call("/api/invites?id=" + li.dataset.id, "DELETE", {}); await loadInv();
        }
      } catch (x) { if (x.name !== "AbortError") { msg.className = "msg msg--err"; msg.textContent = x.message; } }
    });
  });
</script>
</body>
</html>
