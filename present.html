<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표 — HR T | 니핑 프로젝트</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="icon" type="image/png" href="/assets/icons/icon-v3-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* 발표 화면: 16:9 무대를 창 크기에 맞춰 키우고(--u = 무대 폭의 1%), 남는 자리는 라벤더 바탕. 모든 글자·간격이 --u 로 같이 커진다. */
  html, body { height: 100%; overflow: hidden; background: var(--outside); }
  body { font-family: "Noto Sans KR", var(--font); }
  .stage { --u: min(1vw, 1.7778vh); position: fixed; inset: 0; margin: auto; width: calc(var(--u) * 100); height: calc(var(--u) * 56.25); background: var(--paper); overflow: hidden; }
  body.wait .stage { visibility: hidden; }
  .sl { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 calc(var(--u) * 9); opacity: 0; visibility: hidden; transform: translateX(calc(var(--u) * 2)); transition: opacity .35s ease, transform .35s ease, visibility 0s .35s; }
  .sl.on { opacity: 1; visibility: visible; transform: none; transition: opacity .35s ease, transform .35s ease; }
  .sl.past { transform: translateX(calc(var(--u) * -2)); }
  .sl__t { font-size: calc(var(--u) * 5.2); font-weight: 800; line-height: 1.2; letter-spacing: -.02em; margin-bottom: calc(var(--u) * 4.5); }
  .sl__t i, .cover__t i { font-style: normal; color: var(--pink-deep); margin: 0 .06em; }
  /* 표지·마무리: 큰 글 + 마스코트 */
  .cover { background: var(--blush); }
  .cover__t { font-size: calc(var(--u) * 9.4); font-weight: 800; line-height: 1.12; letter-spacing: -.03em; max-width: 62%; }
  .cover__s { max-width: 58%; margin-top: calc(var(--u) * 2.4); font-size: calc(var(--u) * 3); font-weight: 500; color: var(--ink-soft); }
  .cover__f { position: absolute; left: calc(var(--u) * 9); bottom: calc(var(--u) * 5); font-size: calc(var(--u) * 1.9); font-weight: 700; color: var(--ink-soft); }
  .cover__m { position: absolute; right: calc(var(--u) * 7); top: 50%; width: calc(var(--u) * 30); height: calc(var(--u) * 30); transform: translateY(-50%); border-radius: 22%; box-shadow: 0 calc(var(--u) * 1.4) calc(var(--u) * 4) rgb(231 127 176 / .35); }
  .cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--u) * 1.2); background: var(--pink-deep); }
  /* 항목 슬라이드: 항목마다 왼쪽 핑크 막대 */
  .pt { display: grid; gap: calc(var(--u) * 2.6); }
  .pt li { padding-left: calc(var(--u) * 2.2); border-left: calc(var(--u) * .55) solid var(--pink); }
  .pt b { display: block; font-size: calc(var(--u) * 3.4); font-weight: 800; line-height: 1.3; }
  .pt span { display: block; margin-top: calc(var(--u) * .5); font-size: calc(var(--u) * 2.3); color: var(--ink-soft); line-height: 1.5; }
  /* 팀원 */
  .mem { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 3); }
  .mem li { width: calc(var(--u) * 13); text-align: center; }
  .mem__av { display: grid; place-items: center; width: calc(var(--u) * 11); height: calc(var(--u) * 11); margin: 0 auto calc(var(--u) * 1.4); overflow: hidden; border-radius: 50%; background: var(--lavender); font-size: calc(var(--u) * 4.6); font-weight: 800; }
  .mem__av img { width: 100%; height: 100%; object-fit: cover; }
  .mem__n { font-size: calc(var(--u) * 2.3); font-weight: 800; }
  .mem__b { margin-top: calc(var(--u) * .3); font-size: calc(var(--u) * 1.5); color: var(--ink-soft); line-height: 1.4; }
  /* 최신 글 */
  .ar { display: grid; gap: calc(var(--u) * 2); }
  .ar li { display: flex; align-items: baseline; gap: calc(var(--u) * 2); padding-bottom: calc(var(--u) * 1.8); border-bottom: 1px solid var(--line); }
  .ar em { flex: none; font-style: normal; font-size: calc(var(--u) * 1.7); font-weight: 700; padding: calc(var(--u) * .35) calc(var(--u) * 1.1); border-radius: 99px; background: var(--lavender-tint); color: var(--ink-soft); }
  .ar em.ai { background: var(--blush); color: var(--pink-ink); }
  .ar b { font-size: calc(var(--u) * 2.8); font-weight: 700; line-height: 1.35; }
  .none { font-size: calc(var(--u) * 2.4); color: var(--ink-soft); }
  /* 아래 진행 막대·쪽수, 처음 안내, 시작 화면 */
  .pg { position: absolute; left: 0; bottom: 0; height: calc(var(--u) * .5); width: 100%; background: var(--pink-deep); transform: scaleX(0); transform-origin: left; transition: transform .35s ease; }
  .no { position: absolute; right: calc(var(--u) * 3); bottom: calc(var(--u) * 2); font-size: calc(var(--u) * 1.5); font-weight: 700; color: var(--ph); }
  .hint { position: absolute; left: 50%; bottom: calc(var(--u) * 2.2); transform: translateX(-50%); padding: calc(var(--u) * .7) calc(var(--u) * 1.6); font-size: calc(var(--u) * 1.5); font-weight: 700; color: #fff; background: rgb(23 23 25 / .82); border-radius: 99px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .hint.on { opacity: 1; }
  body.idle { cursor: none; }
  .go { position: fixed; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center; gap: 22px; background: var(--outside); text-align: center; }
  .go h1 { font-size: clamp(1.6rem, 3.2vw, 2.6rem); font-weight: 800; letter-spacing: -.02em; }
  .go p { color: var(--ink-soft); }
  .go button { padding: 16px 34px; font: inherit; font-size: 1.125rem; font-weight: 800; color: #fff; background: var(--ink); border: 0; border-radius: 16px; cursor: pointer; }
  .go kbd { padding: 2px 8px; font: inherit; font-weight: 700; background: #fff; border: 1.5px solid var(--field); border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { .sl, .sl.on, .pg { transition: none; } .sl, .sl.past { transform: none; } }
</style>
</head>
<body class="wait">
<main class="stage" id="stage" aria-live="polite"><div class="pg" id="pg"></div><div class="no" id="no"></div><div class="hint" id="hint">← → 로 넘기고, F 로 전체화면, Esc 로 끝내요</div></main>
<div class="go" id="go" hidden>
  <h1>발표를 시작할게요</h1>
  <button type="button" id="goBtn">전체화면으로 시작</button>
  <p><kbd>←</kbd> <kbd>→</kbd> 넘기기 · <kbd>F</kbd> 전체화면 · <kbd>Esc</kbd> 끝내기 — 아무 키나 눌러도 시작해요</p>
</div>
<script src="/assets/deck.js"></script>
<script>
(async () => {
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const title = (s) => esc(s).replace("|", "<i>|</i>");
  const get = (u) => fetch(u, { credentials: "same-origin" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  // 발표 권한 확인: 로그인한 발표자만. 아니면 홈으로.
  const me = await get("/api/me");
  if (!me || !me.user || !me.user.presenter) { location.replace("/"); return; }

  const stage = document.getElementById("stage");
  const [mem, posts] = await Promise.all([get("/api/members"), get("/api/posts?limit=4")]);
  const draw = {
    cover: (s) => `<section class="sl cover"><img class="cover__m" src="/assets/icons/icon-v3-512.png" alt=""><h1 class="cover__t">${title(s.title)}</h1><p class="cover__s">${esc(s.sub)}</p><p class="cover__f">${esc(s.foot)}</p></section>`,
    end: (s) => `<section class="sl cover"><img class="cover__m" src="/assets/icons/icon-v3-512.png" alt=""><h1 class="cover__t">${title(s.title)}</h1><p class="cover__s">${esc(s.sub)}</p></section>`,
    points: (s) => `<section class="sl"><h2 class="sl__t">${title(s.title)}</h2><ul class="pt">${s.points.map(([b, d]) => `<li><b>${esc(b)}</b><span>${esc(d)}</span></li>`).join("")}</ul></section>`,
    members: (s) => `<section class="sl"><h2 class="sl__t">${title(s.title)}</h2><ul class="mem">${((mem && mem.members) || []).map((m) => `<li><div class="mem__av">${m.photoUrl ? `<img src="${esc(m.photoUrl)}" alt="">` : esc([...m.nickname][0] || "T")}</div><p class="mem__n">${esc(m.nickname)}</p>${m.bio ? `<p class="mem__b">${esc(m.bio)}</p>` : ""}</li>`).join("")}</ul></section>`,
    articles: (s) => `<section class="sl"><h2 class="sl__t">${title(s.title)}</h2>${posts && posts.posts && posts.posts.length ? `<ul class="ar">${posts.posts.slice(0, 4).map((p) => `<li><em${p.ai ? ' class="ai"' : ""}>${esc(p.category)}${p.ai ? " · AI" : ""}</em><b>${esc(p.title)}</b></li>`).join("")}</ul>` : '<p class="none">아직 올라온 글이 없어요.</p>'}</section>`,
  };
  stage.insertAdjacentHTML("afterbegin", window.DECK.map((s) => draw[s.t](s)).join(""));
  const slides = [...stage.querySelectorAll(".sl")], N = slides.length;
  const pg = document.getElementById("pg"), no = document.getElementById("no"), hint = document.getElementById("hint");
  let cur = Math.min(N - 1, Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1));
  const go = (i) => {
    cur = Math.min(N - 1, Math.max(0, i));
    slides.forEach((el, k) => { el.classList.toggle("on", k === cur); el.classList.toggle("past", k < cur); });
    pg.style.transform = `scaleX(${N > 1 ? cur / (N - 1) : 1})`; no.textContent = `${cur + 1} / ${N}`;
    history.replaceState(null, "", "#" + (cur + 1));
  };
  go(cur);
  document.body.classList.remove("wait");

  const fs = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {}));
  let started = false, hintT = 0;
  const flash = () => { hint.classList.add("on"); clearTimeout(hintT); hintT = setTimeout(() => hint.classList.remove("on"), 3500); };
  const overlay = document.getElementById("go"); overlay.hidden = false;
  const start = () => { if (started) return; started = true; overlay.hidden = true; fs(); flash(); };
  document.getElementById("goBtn").addEventListener("click", start); document.getElementById("goBtn").focus();

  addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!started) { if (e.key === "Escape") { close(); return; } e.preventDefault(); start(); return; }   // 처음 누른 키는 «시작» 으로만 쓴다
    const k = e.key;
    if (k === "ArrowRight" || k === "ArrowDown" || k === "PageDown" || k === " " || k === "Enter") go(cur + 1);
    else if (k === "ArrowLeft" || k === "ArrowUp" || k === "PageUp" || k === "Backspace") go(cur - 1);
    else if (k === "Home") go(0); else if (k === "End") go(N - 1);
    else if (k === "f" || k === "F" || k === "ㄹ") fs();   // 한글 자판 상태의 F
    else if (k === "Escape") { if (!document.fullscreenElement) close(); return; }   // 전체화면일 땐 브라우저가 먼저 풀어 준다
    else return;
    e.preventDefault();
  });
  // 화면 오른쪽 2/3 를 누르면 다음, 왼쪽 1/3 은 이전
  stage.addEventListener("click", (e) => { if (!started) return; const r = stage.getBoundingClientRect(); go(e.clientX - r.left < r.width / 3 ? cur - 1 : cur + 1); });
  addEventListener("hashchange", () => go((parseInt(location.hash.slice(1), 10) || 1) - 1));
  // 마우스를 가만히 두면 커서를 숨긴다
  let idleT = 0; const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2000); };
  addEventListener("mousemove", wake); wake();
})();
</script>
</body>
</html>
