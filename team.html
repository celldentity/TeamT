<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T조 소개 — HR T | 니핑 프로젝트</title>
<meta name="description" content="HR 미드필더 8기 T조 팀원 소개.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HR T | 니핑">
<meta property="og:title" content="HR T | 니핑 프로젝트">
<meta property="og:description" content="초대장 들고 놀러 오세요">
<meta property="og:image" content="https://tnieping.com/assets/og-v3.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="HR 고민, 티 내도 괜찮아요 — 라벤더 마스코트">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fff6fa">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-v3.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR T 니핑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/assets/icons/icon-v3-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<script src="/assets/shell.js"></script>
<main id="main">
  <section class="sec" aria-labelledby="team-title">
    <div class="wrap">
      <h1 class="sec__title" id="team-title">T조 소개</h1>
      <div class="team-card">
        <h3>HR 미드필더 8기 T조</h3>
        <p>AI와 함께 HR 이야기를 만들고 나누는 스터디 팀이에요.</p>
        <ul>
          <li>AI로 HR 인사이트 아티클을 만들어요</li>
          <li>배운 것을 서로 나누고 함께 정리해요</li>
          <li>HR 이야기가 끊임없이 이어지게 해요</li>
        </ul>
      </div>
      <h2 class="sec__h3" id="mem-title">팀원 <span id="mem-count" style="color:var(--ink-soft);font-weight:500"></span></h2>
      <p class="sec__lead" style="margin-top:6px">가입한 팀원이 자동으로 모여요. 사진과 한 줄 소개는 마이페이지에서 바꿀 수 있어요.</p>
      <ul class="members" id="members" aria-labelledby="mem-title"></ul>
      <div class="empty" id="mem-empty" hidden>아직 팀원이 없어요.</div>
      <p class="msg msg--err" id="mem-err" role="alert"></p>
    </div>
  </section>
</main>
</div>
<div class="pf" id="pf" role="dialog" aria-modal="true" aria-labelledby="pfName" hidden>
  <div class="pf__card">
    <div class="pf__cover" id="pfCover"><button class="pf__x" id="pfX" type="button" aria-label="닫기">✕</button></div>
    <div class="pf__av" id="pfAv"></div>
    <h2 class="pf__name" id="pfName"></h2>
    <p class="pf__bio" id="pfBio"></p>
  </div>
</div>
<script>
  TT.ready.then(async (user) => {
    if (!user) return;
    try {
      const { members } = await TT.call("/api/members");
      document.getElementById("mem-count").textContent = members.length + "명";
      document.getElementById("mem-empty").hidden = members.length > 0;
      document.getElementById("members").innerHTML = members.map((m, i) => `
        <li><button class="member${m.me ? " member--me" : ""}" type="button" data-i="${i}" aria-label="${TT.esc(m.nickname)} 프로필 보기">
          <div class="member__av">${TT.avatar(m)}</div>
          <p class="member__name">${TT.esc(m.nickname)}${m.me ? '<span class="badge">나</span>' : ""}</p>
          <p class="member__bio">${m.bio ? TT.esc(m.bio) : (m.me ? "마이페이지에서 한 줄 소개를 적어 보세요." : "&nbsp;")}</p>
        </button></li>`).join("");

      // 팀원을 누르면 커버 사진과 프로필 사진을 크게 보여 준다
      const pf = document.getElementById("pf"), close = () => { pf.hidden = true; document.body.style.overflow = ""; document.removeEventListener("keydown", onKey); opener && opener.focus(); };
      const onKey = (e) => { if (e.key === "Escape") close(); };
      let opener = null;
      document.getElementById("members").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-i]"); if (!b) return;
        const m = members[Number(b.dataset.i)]; opener = b;
        document.getElementById("pfCover").style.backgroundImage = m.coverUrl ? `url("${m.coverUrl}")` : "";
        document.getElementById("pfAv").innerHTML = TT.avatar(m);
        document.getElementById("pfName").textContent = m.nickname;
        document.getElementById("pfBio").textContent = m.bio || (m.me ? "마이페이지에서 한 줄 소개를 적어 보세요." : "");
        pf.hidden = false; document.body.style.overflow = "hidden"; document.addEventListener("keydown", onKey);
        document.getElementById("pfX").focus();
      });
      document.getElementById("pfX").addEventListener("click", close);
      pf.addEventListener("click", (e) => { if (e.target === pf) close(); });
    } catch (e) { document.getElementById("mem-err").textContent = e.message; }
  });
</script>
</body>
</html>
