<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글쓰기 — HR T | 니핑 프로젝트</title>
<meta name="description" content="아티클 쓰기와 수정.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HR T | 니핑">
<meta property="og:title" content="HR T | 니핑 프로젝트">
<meta property="og:description" content="초대장을 전달받아 놀러 오세요💌">
<meta property="og:image" content="https://tnieping.com/assets/og-v3.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="HR 고민, 티 내도 괜찮아요 — 라벤더 마스코트">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fff6fa">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon-v3.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HR T 니핑">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="/assets/icons/icon-v3-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<script src="/assets/shell.js"></script>
<script src="/assets/media.js"></script>
<script src="/assets/outbox.js"></script>
<main id="main">
  <section class="sec" aria-labelledby="w-title">
    <div class="wrap">
      <a class="back" href="/articles" id="backLink">← 아티클</a>
      <h1 class="sec__title" id="w-title">글쓰기</h1>
      <form class="form" id="form" novalidate>
        <div class="writer" id="writer"></div>
        <div class="field" id="fCat"><span id="catL">분류</span>
          <select name="category" id="cat" data-label="catL" required></select>
        </div>
        <label class="field" id="fTitle">제목
          <input name="title" type="text" maxlength="80" placeholder="2~80자" autocomplete="off" required>
        </label>
        <label class="field"><span id="bodyL">내용</span>
          <textarea class="ta" name="body" rows="12" maxlength="5000" placeholder="10~5000자. 줄바꿈은 그대로 보여요." required></textarea>
        </label>
        <div class="field"><span id="mediaL">사진·동영상 <small id="mediaS">사진은 자동으로 줄여요 · 동영상은 300MB까지 · 최대 10개</small></span>
          <div class="mg" id="mg" aria-labelledby="mediaL"></div>
          <label class="mg__add" id="mgAdd"><input type="file" id="pick" accept="image/*,video/*" multiple> <span>＋ 사진·동영상 추가</span></label>
          <p class="note mg__hint" id="mgHint" hidden>첫 번째 파일이 목록의 대표 썸네일이 돼요.</p>
        </div>
        <label class="check" id="fAi"><input type="checkbox" name="ai"> AI의 도움을 받아 썼어요</label>
        <div class="actions">
          <p class="msg msg--err" id="err" role="alert"></p>
          <button class="btn btn--block" type="submit" id="btn">올리기</button>
        </div>
      </form>
      <div class="empty" id="gone" hidden></div>
    </div>
  </section>
</main>
</div>
<script>
  TT.ready.then(async (user) => {
    if (!user) return;
    const $ = (s) => document.querySelector(s), form = $("#form"), id = Number(new URLSearchParams(location.search).get("id")) || 0;
    const len = (s) => [...s.trim()].length;
    let post = null, saving = false, feed = new URLSearchParams(location.search).has("feed");   // 피드 글쓰기(?feed=1) 또는 피드 글 수정
    $("#writer").innerHTML = "작성자 " + TT.chip(user);
    // 한도: 글은 10개(동영상 3개·300MB), 피드는 10개(동영상 2개·개당 100MB) — 서버(api/_media.js)와 같은 값
    const lim = () => (feed ? { files: TT.media.F_MAX_FILES, videos: TT.media.F_MAX_VIDEOS, video: TT.media.F_MAX_VIDEO } : { files: TT.media.MAX_FILES, videos: TT.media.MAX_VIDEOS, video: undefined });
    function applyFeed() {   // 피드 글: 분류·제목·AI 표시가 없고 내용은 2000자까지(사진만 올려도 된다)
      feed = true;
      for (const s of ["#fCat", "#fTitle", "#fAi"]) $(s).hidden = true;
      $("#w-title").textContent = id ? "피드 수정" : "피드 쓰기";
      $("#bodyL").textContent = "내용";
      form.body.rows = 6; form.body.maxLength = 2000; form.body.required = false; form.body.placeholder = "오늘 어떤 일이 있었나요? (2000자까지, 사진·동영상만 올려도 돼요)";
      $("#mediaS").textContent = "사진은 자동으로 줄여요 · 동영상은 2개까지, 개당 100MB까지 · 최대 10개";
      $("#mgHint").textContent = "올린 순서대로 넘겨 볼 수 있어요.";
      $("#backLink").href = "/articles#feed"; $("#backLink").textContent = "← 피드";
      drawMedia();
    }

    // ── 사진·동영상 ── items: {key, kind, state: prep|up|ok|err, pct, id(서버 파일 번호), preview, msg, item}
    const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
    const items = []; let seq = 0;
    const busy = () => items.some((m) => m.state === "prep" || m.state === "up");
    function drawMedia() {
      $("#mg").innerHTML = items.map((m, i) => `<div class="mg__it mg__it--${m.state}" data-k="${m.key}">
        ${m.preview ? `<img src="${m.preview}" alt="">` : `<span class="mg__ph">${m.kind === "video" ? PLAY : ""}</span>`}
        ${m.kind === "video" ? `<span class="mg__play">${PLAY}</span>` : ""}
        ${i === 0 ? `<span class="mg__cover">${feed ? "첫 장" : "대표"}</span>` : m.state === "ok" ? `<button class="mg__first" type="button" data-act="first" aria-label="${feed ? "맨 앞으로" : "대표로 지정"}">${feed ? "맨 앞으로" : "대표로"}</button>` : ""}
        <button class="mg__x" type="button" data-act="del" aria-label="${m.state === "err" ? "지우기" : "빼기"}">×</button>
        ${m.state === "prep" ? '<span class="mg__st">준비 중…</span>' : ""}
        ${m.state === "up" ? `<span class="mg__st"><b>${Math.round(m.pct * 100)}%</b><i style="width:${Math.round(m.pct * 100)}%"></i></span>` : ""}
        ${m.state === "err" ? `<span class="mg__st mg__st--err">${TT.esc(m.msg || "올리지 못했어요")}</span>` : ""}</div>`).join("");
      $("#mgHint").hidden = items.length < 2;
      $("#mgAdd").hidden = items.length >= lim().files;
    }
    async function addFiles(files) {
      const err = $("#err"); err.textContent = "";
      for (const f of files) {
        if (items.length >= lim().files) { err.textContent = `사진·동영상은 ${lim().files}개까지 붙일 수 있어요.`; break; }
        const c = TT.media.classify(f);
        if (c && c.kind === "video" && items.filter((m) => m.kind === "video").length >= lim().videos) { err.textContent = `동영상은 ${lim().videos}개까지 붙일 수 있어요.`; continue; }
        const m = { key: ++seq, kind: c ? c.kind : "image", state: "prep", pct: 0, id: 0, preview: "", msg: "", item: null };
        items.push(m); drawMedia();
        try {
          m.item = await TT.media.prepare(f, { maxVideo: lim().video }); m.kind = m.item.kind; m.preview = m.item.preview; m.state = "up"; drawMedia();
          const r = await TT.media.upload(m.item, (x) => { m.pct = x; if (!m.t || Date.now() - m.t > 120) { m.t = Date.now(); drawMedia(); } }, feed ? "feed" : undefined);
          m.id = r.id; m.state = "ok"; m.pct = 1;
          if (!items.includes(m)) TT.media.discard(m.id);          // 올리는 도중에 뺀 파일
        } catch (x) {
          if (x.aborted) continue;
          m.state = "err"; m.msg = x.friendly ? x.message : "올리지 못했어요. 다시 시도해 주세요."; if (m.item && m.item.id) TT.media.discard(m.item.id);
        }
        drawMedia();
      }
    }
    $("#pick").addEventListener("change", (e) => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) addFiles(fs); });
    $("#mg").addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]"); if (!b) return;
      const key = Number(b.closest(".mg__it").dataset.k), i = items.findIndex((m) => m.key === key), m = items[i];
      if (b.dataset.act === "first") { items.splice(i, 1); items.unshift(m); }
      else {
        items.splice(i, 1);
        if (m.item && m.item.xhr && m.state === "up") m.item.xhr.abort();
        if (m.state === "ok" && !m.existing) TT.media.discard(m.id);   // 이미 글에 붙은 파일은 저장할 때 서버가 뺀다
      }
      drawMedia();
    });
    addEventListener("beforeunload", (e) => { if (busy()) { e.preventDefault(); e.returnValue = ""; } });
    try {
      if (feed && !id) applyFeed();   // 새 피드 글: 서버에서 받아 올 것이 없다
      else {
        const r = await TT.call(id ? "/api/posts?id=" + id : "/api/posts?limit=1");
        $("#cat").innerHTML = r.categories.map((c) => `<option>${TT.esc(c)}</option>`).join("");
        TT.select($("#cat"));
        post = r.post || null;
        if (post && post.special === "feed") applyFeed();
      }
    } catch (x) { form.hidden = true; $("#gone").hidden = false; $("#gone").textContent = x.message; return; }
    if (id) {
      if (!post.mine) { form.hidden = true; $("#gone").hidden = false; $("#gone").textContent = "내가 쓴 글만 고칠 수 있어요."; return; }
      $("#w-title").textContent = feed ? "피드 수정" : "글 수정"; $("#btn").textContent = "저장";
      $("#backLink").href = "/article?id=" + id; $("#backLink").textContent = "← 글로 돌아가기";
      if (!feed) { form.category.value = post.category; $("#cat")._sel.sync(); form.title.value = post.title; form.ai.checked = post.ai; }
      form.body.value = post.body;
      for (const x of post.media || []) items.push({ key: ++seq, kind: x.kind, state: "ok", pct: 1, id: x.id, existing: true, preview: x.thumb ? `/api/media?id=${x.id}&v=thumb` : (x.kind === "image" ? `/api/media?id=${x.id}&v=full` : ""), msg: "", item: null });
      drawMedia();
    }
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = $("#err"), btn = $("#btn"), label = btn.textContent; err.textContent = "";
      if (items.some((m) => m.state === "err")) { err.textContent = "올리지 못한 파일이 있어요. × 로 지우고 다시 올려 주세요."; return; }
      if (feed) { if (!len(form.body.value) && !items.length) { err.textContent = "내용을 적거나 사진·동영상을 올려 주세요."; return; } }
      else {
        if (len(form.title.value) < 2) { err.textContent = "제목을 2자 이상 적어 주세요."; return; }
        if (len(form.body.value) < 10) { err.textContent = "내용을 10자 이상 적어 주세요."; return; }
      }
      // 저장: 편지함(outbox)에 넣고 화면은 바로 «저장된 글»로 넘어간다. 실제 저장(DB)은 뒤에서 한다. 사진·동영상이 아직 올라가는 중이면 그게 끝나는 즉시 같은 방식으로 저장한다.
      const send = () => {
        const media = items.filter((m) => m.state === "ok");
        const d = feed ? { kind: "feed", body: form.body.value, media: media.map((m) => m.id) } : { category: form.category.value, title: form.title.value, body: form.body.value, ai: form.ai.checked, media: media.map((m) => m.id) };
        const body = d.body.replace(/\r\n/g, "\n").trim();
        const view = { ...(feed ? { feed: true, category: "피드", title: ([...body.split("\n").find((x) => x.trim()) || ""].slice(0, 40).join("") || "사진"), ai: false } : { category: d.category, title: d.title.trim(), ai: d.ai }), body, media: media.map((m) => ({ id: m.id, kind: m.kind, thumb: !!(m.preview || (m.item && m.item.thumb)) })) };
        if (id) { TT.outbox.add({ kind: "post-edit", url: "/api/posts?id=" + id, method: "PATCH", body: d, postId: id, view }, { defer: true }); location.href = "/article?id=" + id; }
        else { const oid = TT.outbox.add({ kind: "post", url: "/api/posts", method: "POST", body: d, view }, { defer: true }); location.href = feed ? "/articles#feed" : "/article?p=" + oid; }
      };
      if (!busy()) return send();
      btn.disabled = true; saving = true;
      const t = setInterval(() => {
        if (items.some((m) => m.state === "err")) { clearInterval(t); saving = false; btn.disabled = false; btn.textContent = label; err.textContent = "올리지 못한 파일이 있어요. × 로 지우고 다시 올려 주세요."; return; }
        if (!busy()) { clearInterval(t); send(); return; }
        const up = items.filter((m) => m.state === "up"); btn.textContent = up.length ? `사진·동영상 올리는 중 ${Math.round(up.reduce((a, m) => a + m.pct, 0) / up.length * 100)}%` : "준비 중…";
      }, 200);
    });
  });
</script>
</body>
</html>
